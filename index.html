<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Trocas - Rede Market</title>
  <style>
    /* ==========================================================
       ESTILOS GERAIS E RESET
       ================================================---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #334155;
      padding-bottom: 40px;
    }

    /* ==========================================================
       CABEÇALHO PROFISSIONAL MINIMALISTA (REDESENHADO)
       ================================================---------- */
    .top {
      background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
      color: #fff; 
      padding: 14px 16px; 
      position: sticky; 
      top: 0; 
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .header-content-wrapper {
      width: 100%; 
      max-width: 600px; 
      margin: 0 auto;
      display: flex; 
      flex-direction: column; 
      gap: 10px;
    }

    .header-main-row {
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      width: 100%;
      gap: 12px;
    }

    .header-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    /* Logo integrada com acabamento limpo */
    .logo-container-pro {
      background: rgba(255, 255, 255, 0.95);
      padding: 5px 10px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .header-logo { height: 22px; width: auto; object-fit: contain; }

    .header-text-box {
      min-width: 0;
    }
    .header-text-box h1 { 
      font-size: 15px; 
      font-weight: 700; 
      margin: 0; 
      color: #ffffff; 
      letter-spacing: -0.2px;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .header-text-box .sub { 
      color: #38bdf8; 
      font-size: 11px; 
      font-weight: 500;
      margin-top: 1px; 
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    /* Botão de Menu estilo pílula refinado */
    .btn-menu-pro {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .btn-menu-pro:active {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Seletor de Loja Estilizado */
    .header-sub-row {
      width: 100%;
      display: flex;
      align-items: center;
    }

    .select-loja-pro {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background-color: rgba(15, 23, 42, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      color: #e2e8f0 !important;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 32px 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }
    .select-loja-pro option {
      background: #0f172a !important;
      color: #ffffff !important;
    }

    /* ==========================================================
       CONTEÚDO DA PÁGINA (EXEMPLO DE LAYOUT)
       ================================================---------- */
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      transition: background 0.2s;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

  <header class="top">
    <div class="header-content-wrapper">
      <div class="header-main-row">
        <div class="header-brand-group">
          <div class="logo-container-pro">
            <svg class="header-logo" viewBox="0 0 540 180" xmlns="http://www.w3.org/2000/svg">
              <path d="M 30,120 L 30,55 C 30,35 45,20 65,20 L 115,20 C 145,20 165,40 165,70 C 165,95 145,115 120,120 L 155,160 L 125,160 L 95,120 L 65,120 L 65,160 L 30,160 Z M 65,50 L 65,95 L 110,95 C 125,95 135,85 135,72 C 135,60 125,50 110,50 Z" fill="#0066b2"/>
              <circle cx="30" cy="35" r="14" fill="#0066b2"/>
              <circle cx="30" cy="145" r="14" fill="#0066b2"/>
              <text x="175" y="68" font-family="Arial, sans-serif" font-weight="700" font-size="52" fill="#0066b2" letter-spacing="-1">rede</text>
              <text x="170" y="145" font-family="Arial, sans-serif" font-weight="900" font-size="82" fill="#e30613" letter-spacing="-2">market</text>
            </svg>
          </div>
          <div class="header-text-box">
            <h1>Gestão de Trocas</h1>
            <div class="sub">Devoluções</div>
          </div>
        </div>
        <button type="button" class="btn-menu-pro" onclick="voltarAoMenu()">Menu</button>
      </div>

      <div class="header-sub-row">
        <select id="selectLojaTrc" class="select-loja-pro" onchange="mudarLojaSelect(this.value)">
          <option value="PATITIBA">PATITIBA</option>
          <option value="BANANAL">BANANAL</option>
          <option value="LAPA">LAPA</option>
          <option value="CAIS">CAIS</option>
          <option value="TEXACO">TEXACO</option>
          <option value="BALNEÁRIO">BALNEÁRIO</option>
          <option value="ENSEADA">ENSEADA</option>
          <option value="JAPUÍBA">JAPUÍBA</option>
          <option value="NOVA ANGRA">NOVA ANGRA</option>
          <option value="RIBEIRA">RIBEIRA</option>
          <option value="FRADE">FRADE</option>
          <option value="PARQUE MAMBUCABA">PARQUE MAMBUCABA</option>
          <option value="CENTRO">CENTRO</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Área de Trabalho</h2>
      <button class="btn-primary" onclick="alert('Módulo pronto!')">Nova Operação</button>
    </section>
  </main>

  <script>
    function voltarAoMenu() {
      // Insira aqui a lógica de redirecionamento para o menu principal
      window.location.href = "index.html"; 
    }

    function mudarLojaSelect(loja) {
      console.log("Loja alterada para: ", loja);
      // Salvar preferência se necessário (ex: localStorage)
      localStorage.setItem("lojaSelecionada", loja);
    }
  </script>
</body>
</html>
