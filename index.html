<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Planilha - Pró Ativo Frios</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 120px; font-weight: bold; }
    input, select { padding: 5px; width: 200px; }
    button { padding: 8px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; margin-right: 10px; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: left; }
    th { background-color: #007bff; color: white; }
  </style>
</head>
<body>

  <h1>Pró Ativo Frios</h1>

  <div class="form-group">
    <label for="produto">Produto:</label>
    <input type="text" id="produto">
  </div>

  <div class="form-group">
    <label for="quantidade">Quantidade:</label>
    <input type="number" id="quantidade">
  </div>

  <div class="form-group">
    <label for="valor">Valor:</label>
    <input type="number" step="0.01" id="valor">
  </div>

  <div class="form-group">
    <label for="categoria">Categoria:</label>
    <select id="categoria">
      <option value="Congelados">Congelados</option>
      <option value="Refrigerados">Refrigerados</option>
      <option value="Embutidos">Embutidos</option>
    </select>
  </div>

  <button onclick="adicionar()">Adicionar</button>
  <button onclick="gerarPlanilha()">Gerar Planilha</button>
  <button onclick="limpar()">Limpar</button>

  <table id="tabela">
    <thead>
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Valor</th>
        <th>Categoria</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const dados = [];

    function adicionar() {
      const produto    = document.getElementById('produto').value.trim();
      const quantidade = document.getElementById('quantidade').value;
      const valor      = document.getElementById('valor').value;
      const categoria  = document.getElementById('categoria').value;

      if (!produto || !quantidade || !valor) {
        alert('Preencha todos os campos!');
        return;
      }

      dados.push({
        Produto: produto,
        Quantidade: Number(quantidade),
        Valor: Number(valor),
        Categoria: categoria
      });

      renderizar();
      document.getElementById('produto').value = '';
      document.getElementById('quantidade').value = '';
      document.getElementById('valor').value = '';
    }

    function renderizar() {
      const tbody = document.querySelector('#tabela tbody');
      tbody.innerHTML = '';
      dados.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.Produto}</td>
          <td>${d.Quantidade}</td>
          <td>${d.Valor.toFixed(2)}</td>
          <td>${d.Categoria}</td>`;
        tbody.appendChild(tr);
      });
    }

    function limpar() {
      if (dados.length && !confirm('Apagar todos os registros?')) return;
      dados.length = 0;
      renderizar();
    }

    function gerarPlanilha() {
      if (dados.length === 0) {
        alert('Nenhum dado para exportar!');
        return;
      }

      const ws = XLSX.utils.json_to_sheet(dados);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Produtos');

      XLSX.writeFile(wb, 'ProAtivoFrios.xlsx');
    }
  </script>

</body>
</html>
