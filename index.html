<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>União dos Sites</title>
    <!-- Carregamento da biblioteca de código de barras -->
    <script src="https://unpkg.com/@zxing/library@latest" type="text/javascript"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .container-botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .btn-modulo {
            background: linear-gradient(135deg, #1e88e5, #0d47a1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-modulo:active {
            transform: scale(0.98);
        }

        /* Estilos do Botão Flutuante e Modal de Impressão do Script */
        @media print {
            @page {
                size: A4 landscape !important;
                margin: 0mm !important;
            }
            html, body {
                width: 100% !important;
                height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                background: #ffffff !important;
            }
            *, *::before, *::after {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            #btnCamFlutuante, #modalScannerOverlay {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <h1>Selecione o Módulo Desejado</h1>

    <div class="container-botoes">
        <!-- Botão 1 -->
        <button class="btn-modulo" onclick="navegarPara('https://badalipe.github.io/proativo/')">
            ↑ PRÓATIVO
        </button>

        <!-- Botão 2 -->
        <button class="btn-modulo" onclick="navegarPara('https://badalipe.github.io/proativo/')">
            ⇄ TROCAS
        </button>

        <!-- Botão 3 -->
        <button class="btn-modulo" onclick="navegarPara('https://badalipe.github.io/proativo/')">
            ↓ PERDAS
        </button>

        <!-- 4º Botão Adicionado: Cartaz Fácil -->
        <button class="btn-modulo" style="background: linear-gradient(135deg, #2e7d32, #1b5e20);" onclick="abrirCartazFacil()">
            📋 CARTAZ FÁCIL
        </button>
    </div>

    <script>
        // Função de navegação simples
        function navegarPara(url) {
            window.location.href = url;
        }

        // Configuração do Auto-Login do Cartaz Fácil
        const USUARIO_CARTAZ = "rmarket07";
        const SENHA_CARTAZ = "sup12345";

        function abrirCartazFacil() {
            // Direciona para o Cartaz Fácil
            window.location.href = "https://rmarket.cartazfacil.pro/index.php";
        }

        // EXECUÇÃO DO USERSCRIPT (BIPAR + LEITOR DE CÓDIGO DE BARRAS)
        (function() {
            'use strict';

            // Oculta textos de dobra em telas de impressão
            function ocultarApenasTextosDobra() {
                var urlAtual = window.location.href.toLowerCase();
                if (urlAtual.includes('imprim') || urlAtual.includes('preview')) {
                    var elementos = document.querySelectorAll('span, p, div, small, b, strong');
                    elementos.forEach(function(el) {
                        if (el.children.length === 0 && el.textContent) {
                            var txt = el.textContent.trim().toUpperCase();
                            if (txt === 'DOBRE AQUI' || txt === 'CORTE AQUI' || txt === 'DOBRE' || txt === 'CORTE') {
                                el.style.visibility = 'hidden';
                                el.style.fontSize = '0px';
                            }
                        }
                    });
                }
            }
            setInterval(ocultarApenasTextosDobra, 400);

            var currentStream = null;
            var codeReader = null;

            function tocarBeep() {
                try {
                    var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } catch(e) {}
            }

            // Criação do Botão Flutuante de Bipar
            function forcarBotao() {
                var urlAtual = window.location.href.toLowerCase();
                
                // Auto Login na tela de login
                if (urlAtual.includes('cartazfacil.pro')) {
                    var campoUser = document.querySelector('input[type="text"], input[name*="user"], input[name*="login"]');
                    var campoPass = document.querySelector('input[type="password"]');
                    var btnSubmit = document.querySelector('button[type="submit"], input[type="submit"]');

                    if (campoUser && campoPass && campoUser.value === "") {
                        campoUser.value = USUARIO_CARTAZ;
                        campoPass.value = SENHA_CARTAZ;
                        if (btnSubmit) btnSubmit.click();
                    }
                }

                var ehTelaLogin = urlAtual.includes('login') || document.querySelector('input[type="password"]') !== null;
                var ehTelaImpressao = urlAtual.includes('imprim') || urlAtual.includes('preview');

                if (ehTelaLogin || ehTelaImpressao || !urlAtual.includes('cartazfacil.pro')) {
                    var btnExistente = document.getElementById('btnCamFlutuante');
                    if (btnExistente) btnExistente.style.display = 'none';
                    return;
                }

                if (document.getElementById('btnCamFlutuante')) {
                    document.getElementById('btnCamFlutuante').style.display = 'flex';
                    return;
                }

                var btn = document.createElement('button');
                btn.id = 'btnCamFlutuante';
                btn.innerHTML = `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%;">
                        <span style="font-size: 10px; font-weight: 900; color: #FFFFFF;">BIPAR</span>
                    </div>
                `;

                btn.style.cssText = `
                    position: fixed !important; bottom: 170px !important; right: 25px !important;
                    width: 68px !important; height: 68px !important; z-index: 2147483647 !important;
                    background: linear-gradient(145deg, #1e88e5, #0d47a1) !important;
                    border: 2px solid rgba(255, 255, 255, 0.8) !important; border-radius: 50% !important;
                    cursor: pointer !important; display: flex !important; align-items: center !important;
                    justify-content: center !important;
                `;

                btn.onclick = function(e) {
                    e.preventDefault();
                    abrirScanner();
                };

                document.body.appendChild(btn);
            }

            function abrirScanner() {
                if (document.getElementById('modalScannerOverlay')) return;

                var overlay = document.createElement('div');
                overlay.id = 'modalScannerOverlay';
                overlay.style.cssText = 'position: fixed !important; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2147483647; display: flex; flex-direction: column; justify-content: space-between;';

                overlay.innerHTML = `
                    <video id="videoScanner" playsinline autoplay muted style="position: absolute; width: 100%; height: 100%; object-fit: cover;"></video>
                    <div style="position: relative; z-index: 10; padding: 20px; color: #fff; text-align: center;">Escanear código...</div>
                    <div style="position: relative; z-index: 10; padding: 25px; text-align: center;">
                        <button id="btnFecharScanner" style="padding: 14px 30px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; border-radius: 25px;">Fechar</button>
                    </div>
                `;

                document.body.appendChild(overlay);
                document.getElementById('btnFecharScanner').onclick = function() { fecharEPreencher(null); };

                iniciarCamera();
            }

            function iniciarCamera() {
                var videoElem = document.getElementById('videoScanner');
                navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }).then(function(stream) {
                    currentStream = stream;
                    videoElem.srcObject = stream;
                    codeReader = new ZXing.BrowserMultiFormatReader();
                    codeReader.decodeFromConstraints({ video: { facingMode: { ideal: "environment" } } }, 'videoScanner', function(result) {
                        if (result) {
                            tocarBeep();
                            fecharEPreencher(result.getText());
                        }
                    });
                }).catch(function() {});
            }

            function fecharEPreencher(codigo) {
                if (codeReader) { try { codeReader.reset(); } catch(e){} }
                if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
                var overlay = document.getElementById('modalScannerOverlay');
                if (overlay) overlay.parentNode.removeChild(overlay);
                if (codigo) preencherEBuscar(codigo);
            }

            function preencherEBuscar(codigo) {
                var inputs = Array.from(document.querySelectorAll('input'));
                var inputAlvo = inputs.find(i => i.type === 'text' || i.type === 'search');
                if (inputAlvo) {
                    inputAlvo.value = codigo;
                    inputAlvo.dispatchEvent(new Event('input', { bubbles: true }));
                    var btnPesquisar = document.querySelector('button[type="submit"], input[type="submit"]');
                    if (btnPesquisar) btnPesquisar.click();
                }
            }

            setInterval(forcarBotao, 500);
        })();
    </script>
</body>
</html>
