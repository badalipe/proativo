<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>União dos Sites</title>
    <script src="https://unpkg.com/@zxing/library@latest" type="text/javascript"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            color: #ffffff;
        }

        /* Container do Menu Inicial */
        #menuPrincipal {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            text-align: center;
        }

        .container-botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        .btn-modulo {
            background: linear-gradient(135deg, #1e88e5, #0d47a1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-decoration: none;
        }

        .btn-modulo:active {
            transform: scale(0.98);
        }

        /* Moldura para carregar os sites mantendo o botão visível */
        #frameSite {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }

        /* Botão Flutuante */
        #btnCamFlutuante {
            position: fixed !important;
            bottom: 30px !important;
            right: 20px !important;
            width: 68px !important;
            height: 68px !important;
            z-index: 2147483647 !important;
            background: linear-gradient(145deg, #1e88e5, #0d47a1) !important;
            border: 2px solid rgba(255, 255, 255, 0.9) !important;
            border-radius: 50% !important;
            box-shadow: 0 8px 18px rgba(0,0,0,0.4) !important;
            cursor: pointer !important;
            display: none;
            align-items: center !important;
            justify-content: center !important;
        }

        /* Tela inteira da câmera ao escanear */
        #modalScannerOverlay {
            position: fixed !important;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 2147483647;
            display: flex; flex-direction: column; justify-content: space-between;
        }
    </style>
</head>
<body>

    <!-- Menu de navegação inicial -->
    <div id="menuPrincipal">
        <h1>Selecione o Módulo Desejado</h1>
        <div class="container-botoes">
            <button class="btn-modulo" onclick="abrirNoFrame('https://badalipe.github.io/proativo/')">
                ↑ PRÓATIVO
            </button>
            <button class="btn-modulo" onclick="abrirNoFrame('https://badalipe.github.io/proativo/')">
                ⇄ TROCAS
            </button>
            <button class="btn-modulo" onclick="abrirNoFrame('https://badalipe.github.io/proativo/')">
                ↓ PERDAS
            </button>
            <button class="btn-modulo" style="background: linear-gradient(135deg, #2e7d32, #1b5e20);" onclick="abrirNoFrame('https://rmarket.cartazfacil.pro/index.php')">
                📋 CARTAZ FÁCIL
            </button>
        </div>
    </div>

    <!-- Iframe onde o site selecionado roda -->
    <iframe id="frameSite"></iframe>

    <!-- Botão Flutuante BIPAR -->
    <button id="btnCamFlutuante" onclick="abrirScanner()">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M3 7V5C3 3.89543 3.89543 3 5 3H7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M17 3H19C20.1046 3 21 3.89543 21 5V7" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M21 17V19C21 20.1046 20.1046 21 19 21H17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M7 21H5C3.89543 21 3 20.1046 3 19V17" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="7" y1="8" x2="7" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                <line x1="10" y1="8" x2="10" y2="16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="14" y1="8" x2="14" y2="16" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="17" y1="8" x2="17" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
                <line x1="2" y1="12" x2="22" y2="12" stroke="#FF3B30" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span style="font-size: 9px; font-weight: 900; color: #FFFFFF; margin-top: 1px;">BIPAR</span>
        </div>
    </button>

    <script>
        var currentStream = null;
        var codeReader = null;

        function abrirNoFrame(url) {
            document.getElementById('menuPrincipal').style.display = 'none';
            var iframe = document.getElementById('frameSite');
            iframe.style.display = 'block';
            iframe.src = url;
            
            // Exibe o botão BIPAR assim que entra no site
            document.getElementById('btnCamFlutuante').style.display = 'flex';
        }

        function tocarBeep() {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        function abrirScanner() {
            if (document.getElementById('modalScannerOverlay')) return;

            var overlay = document.createElement('div');
            overlay.id = 'modalScannerOverlay';
            overlay.innerHTML = `
                <video id="videoScanner" playsinline autoplay muted style="position: absolute; width: 100%; height: 100%; object-fit: cover;"></video>
                <div style="position: relative; z-index: 10; padding: 20px; color: #fff; text-align: center; font-weight: bold;">Escanear código de barras...</div>
                <div style="position: relative; z-index: 10; padding: 25px; text-align: center;">
                    <button id="btnFecharScanner" style="padding: 14px 30px; background: rgba(0,0,0,0.8); color: #fff; border: 1px solid #fff; border-radius: 25px; font-weight: bold;">Fechar Câmera</button>
                </div>
            `;

            document.body.appendChild(overlay);
            document.getElementById('btnFecharScanner').onclick = function() { fecharEPreencher(null); };

            iniciarCamera();
        }

        function iniciarCamera() {
            var videoElem = document.getElementById('videoScanner');
            navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } }).then(function(stream) {
                currentStream = stream;
                videoElem.srcObject = stream;
                codeReader = new ZXing.BrowserMultiFormatReader();
                codeReader.decodeFromConstraints({ video: { facingMode: { ideal: "environment" } } }, 'videoScanner', function(result) {
                    if (result) {
                        tocarBeep();
                        fecharEPreencher(result.getText());
                    }
                });
            }).catch(function(err) {
                alert("Erro ao acessar a câmera. Verifique se o Chrome tem permissão de Câmera.");
            });
        }

        function fecharEPreencher(codigo) {
            if (codeReader) { try { codeReader.reset(); } catch(e){} }
            if (currentStream) { currentStream.getTracks().forEach(track => track.stop()); }
            var overlay = document.getElementById('modalScannerOverlay');
            if (overlay) overlay.parentNode.removeChild(overlay);
            
            if (codigo) {
                preencherEBuscar(codigo);
            }
        }

        function preencherEBuscar(codigo) {
            var iframe = document.getElementById('frameSite');
            try {
                var doc = iframe.contentDocument || iframe.contentWindow.document;
                var inputs = Array.from(doc.querySelectorAll('input'));
                var inputAlvo = inputs.find(i => i.type === 'text' || i.type === 'search');
                if (inputAlvo) {
                    inputAlvo.value = codigo;
                    inputAlvo.dispatchEvent(new Event('input', { bubbles: true }));
                    inputAlvo.dispatchEvent(new Event('change', { bubbles: true }));

                    var btnPesquisar = doc.querySelector('button[type="submit"], input[type="submit"]');
                    if (btnPesquisar) btnPesquisar.click();
                }
            } catch(e) {
                // Caso haja restrição de cross-origin do navegador ao ler o iframe
                alert("Código lido: " + codigo + "\nCole no campo do site caso não preencha automaticamente.");
            }
        }
    </script>
</body>
</html>
