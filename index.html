<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Coletor de Dados - Rede Market</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 margin: 15px;
 background-color: #f4f4f9;
 }
 .container {
 max-width: 600px;
 margin: 0 auto;
 background: #fff;
 padding: 20px;
 border-radius: 8px;
 box-shadow: 0 2px 5px rgba(0,0,0,0.1);
 }
 h2 {
 text-align: center;
 color: #333;
 }
 .form-group {
 margin-bottom: 12px;
 }
 label {
 display: block;
 margin-bottom: 4px;
 font-weight: bold;
 font-size: 14px;
 }
 input, select {
 width: 100%;
 padding: 9px;
 box-sizing: border-box;
 border: 1px solid #ccc;
 border-radius: 4px;
 }
 button {
 width: 100%;
 padding: 12px;
 background-color: #007bff;
 color: white;
 border: none;
 border-radius: 4px;
 font-size: 15px;
 font-weight: bold;
 cursor: pointer;
 margin-top: 5px;
 }
 button:hover {
 background-color: #0056b3;
 }
 .file-box {
 background: #e9ecef;
 border: 2px dashed #6c757d;
 padding: 12px;
 border-radius: 6px;
 text-align: center;
 margin-bottom: 15px;
 }
 .table-preview {
 margin-top: 15px;
 width: 100%;
 border-collapse: collapse;
 font-size: 13px;
 }
 .table-preview th, .table-preview td {
 border: 1px solid #ddd;
 padding: 6px;
 text-align: left;
 }
 .table-preview th {
 background-color: #f2f2f2;
 }
 </style>
 <!-- Biblioteca para ler e exportar arquivos Excel (.xlsx) -->
 <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
 <h2>Lançamento de Estoque - Patitiba</h2>
  
 <!-- PASSO 1: Carregar o modelo oficial da planilha -->
 <div class="file-box">
 <label for="excelFile" style="cursor: pointer; color: #0056b3;">📁 <strong>1º Clique aqui para carregar sua planilha modelo (.xlsx)</strong></label>
 <input type="file" id="excelFile" accept=".xlsx, .xls" style="margin-top: 8px;">
 </div>

<form id="stockForm">
 <div class="form-group">
 <label for="loja">Loja</label>
 <input type="text" id="loja" value="PATITIBA" readonly style="background-color: #e9ecef;">
 </div>
 
 <div class="form-group">
 <label for="codigo">Código do Produto (Código de Barras)</label>
 <input type="text" id="codigo" placeholder="Bip ou digite o código" autofocus required>
 </div>
 
 <div class="form-group">
 <label for="descricao">Descrição do Produto</label>
 <input type="text" id="descricao" placeholder="Nome do produto" required>
 </div>
 
 <div class="form-group">
 <label for="qtd">Quantidade no Estoque</label>
 <input type="number" id="qtd" step="any" required>
 </div>
 
 <div class="form-group">
 <label for="unidade">Unidade / Caixa / Fardo</label>
 <select id="unidade">
 <option value="und">und</option>
 <option value="cx">cx</option>
 <option value="fd">fd</option>
 <option value="kg">kg</option>
 </select>
 </div>
 
 <div class="form-group">
 <label for="validade">Data de Validade</label>
 <input type="text" id="validade" placeholder="DD/MM/AAAA">
 </div>
 
 <div class="form-group">
 <label for="valor">Valor Unitário (R$)</label>
 <input type="number" id="valor" step="0.01" value="0.00">
 </div>
 
 <button type="button" onclick="adicionarItem()">Adicionar à Lista</button>
 </form>
 
 <br>
 <button type="button" onclick="salvarNaPlanilhaModelo()" style="background-color: #28a745;">💾 2º Salvar na Planilha Oficial</button>
 
 <h3>Itens Digitados</h3>
 <table class="table-preview" id="itensTable">
 <thead>
 <tr>
 <th>Item</th>
 <th>Loja</th>
 <th>Código</th>
 <th>Descrição</th>
 <th>Qtd</th>
 </tr>
 </thead>
 <tbody>
 <!-- Os itens digitados aparecem aqui -->
 </tbody>
 </table>
</div>

<script>
 let templateWorkbook = null;
 const itens = [];

 // Leitura da planilha modelo enviada pelo usuário ao abrir o app
 document.getElementById('excelFile').addEventListener('change', function(e) {
 const file = e.target.files[0];
 if (!file) return;

 const reader = new FileReader();
 reader.onload = function(evt) {
 const data = new Uint8Array(evt.target.result);
 templateWorkbook = XLSX.read(data, { type: 'array' });
 alert('Planilha modelo carregada com sucesso! Agora pode lançar os produtos.');
 };
 reader.readAsArrayBuffer(file);
 });

 function adicionarItem() {
 const codigo = document.getElementById('codigo').value.trim();
 const descricao = document.getElementById('descricao').value.trim();
 const qtd = document.getElementById('qtd').value;
 const unidade = document.getElementById('unidade').value;
 const validade = document.getElementById('validade').value.trim();
 const valor = parseFloat(document.getElementById('valor').value || 0);
 
 if (!codigo || !descricao || !qtd) {
 alert('Preencha o Código, a Descrição e a Quantidade!');
 return;
 }
 
 itens.push({
 itemNum: itens.length + 1,
 comprador: '', // Em branco conforme solicitado
 loja: 'PATITIBA', // Sempre Patitiba
 codigo: codigo,
 descricao: descricao,
 qtd: Number(qtd),
 unidade: unidade,
 validade: validade,
 valor: valor
 });
 
 atualizarTabela();
 limparCampos();
 }

 function atualizarTabela() {
 const tbody = document.querySelector('#itensTable tbody');
 tbody.innerHTML = '';
 
 itens.forEach(item => {
 const tr = document.createElement('tr');
 tr.innerHTML = `
 <td>${item.itemNum}</td>
 <td>${item.loja}</td>
 <td>${item.codigo}</td>
 <td>${item.descricao}</td>
 <td>${item.qtd}</td>
 `;
 tbody.appendChild(tr);
 });
 }

 function limparCampos() {
 document.getElementById('codigo').value = '';
 document.getElementById('descricao').value = '';
 document.getElementById('qtd').value = '';
 document.getElementById('validade').value = '';
 document.getElementById('codigo').focus();
 }

 function salvarNaPlanilhaModelo() {
 if (itens.length === 0) {
 alert('Adicione pelo menos um item antes de salvar!');
 return;
 }

 if (!templateWorkbook) {
 alert('Por favor, selecione a planilha modelo (.xlsx) no botão superior antes de salvar!');
 return;
 }

 // Pega a primeira aba da planilha modelo
 const firstSheetName = templateWorkbook.SheetNames[0];
 const worksheet = templateWorkbook.Sheets[firstSheetName];

 // A tabela começa na linha 7 (índice 6 em JavaScript, pois começa do 0)
 // Mapeamento correto das colunas baseado na sua estrutura:
 // Coluna A (0) = Número do item (1, 2, 3...)
 // Coluna B (1) = Comprador (fica em branco)
 // Coluna C (2) = Loja ("PATITIBA")
 // Coluna D (3) = Código do Produto (Código de Barras)
 // Coluna E (4) = Descrição do produto
 // Coluna F (5) = Quantidade no Estoque
 // Coluna G (6) = Unidade / Caixa / Fardo
 // Coluna H (7) = Data de Validade
 // Coluna I (8) = Valor Unitário

 itens.forEach((item, index) => {
 const rowIndex = 6 + index; // Linha 7 do Excel é o índice 6

 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 0})] = { t: 'n', v: item.itemNum };
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 1})] = { t: 's', v: item.comprador }; // Branco
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 2})] = { t: 's', v: item.loja };     // PATITIBA
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 3})] = { t: 's', v: item.codigo };   // Código de barras
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 4})] = { t: 's', v: item.descricao };// Descrição
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 5})] = { t: 'n', v: item.qtd };      // Qtd
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 6})] = { t: 's', v: item.unidade };  // Unidade
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 7})] = { t: 's', v: item.validade }; // Data
 worksheet[XLSX.utils.encode_cell({r: rowIndex, c: 8})] = { t: 'n', v: item.valor };    // Valor
 });

 // Atualiza o intervalo total da planilha para garantir que todas as linhas apareçam
 const range = XLSX.utils.decode_range(worksheet['!ref']);
 if (range.e.r < 6 + itens.length - 1) {
 range.e.r = 6 + itens.length - 1;
 worksheet['!ref'] = XLSX.utils.encode_range(range);
 }

 // Baixa o arquivo preenchido mantendo a formatação original da rede
 XLSX.writeFile(templateWorkbook, "Pro_Ativo_Patitiba_Preenchido.xlsx");
 alert('Planilha salva e baixada com sucesso nas linhas e colunas corretas!');
 }
</script>

</body>
</html>
