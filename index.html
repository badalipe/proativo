<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Trocas - Rede Market</title>
  <style>
    :root {
      --primary: #007bff;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #cccccc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #1a1a1a;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Container Quadrado Reservado para a Imagem do Produto */
    .imagem-container {
      width: 100%;
      max-width: 240px;
      aspect-ratio: 1 / 1;
      margin: 12px auto;
      background-color: #e9ecef;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .imagem-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .imagem-placeholder {
      color: #6c757d;
      font-size: 14px;
      text-align: center;
      padding: 8px;
    }

    .spinner {
      display: none;
      width: 32px;
      height: 32px;
      border: 3px solid #ccc;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-msg {
      font-size: 0.85rem;
      margin-top: 4px;
    }
    .ok { color: #28a745; }
    .warn { color: #dc3545; }
  </style>
</head>
<body>

<div class="container">
  <!-- 1. IDENTIFICAÇÃO DA LOJA -->
  <div class="card">
    <h2>🏢 1. Identificação da Loja</h2>
    <div class="form-group">
      <label for="trc_loja">Selecione a Loja</label>
      <select id="trc_loja">
        <option value="1">1. PATITIBA</option>
        <option value="2">2. CENTRO</option>
        <option value="3">3. BANANAL</option>
      </select>
    </div>
  </div>

  <!-- 2. DADOS DA TROCA -->
  <div class="card">
    <h2>✏️ 2. Dados da Troca</h2>

    <div class="form-group">
      <label for="trc_codigo">EAN / Código do Produto</label>
      <input type="text" id="trc_codigo" placeholder="Digite ou escaneie o código" onblur="buscarProduto('trocas')">
      <div id="trc_status" class="status-msg"></div>
    </div>

    <!-- Container da Imagem em proporção 1:1 -->
    <div class="imagem-container">
      <div id="loadingSpinner" class="spinner"></div>
      <span id="fotoPlaceholder" class="imagem-placeholder">Foto do Produto</span>
      <img id="fotoProduto" src="" alt="Foto do Produto">
    </div>

    <div class="form-group">
      <label for="trc_descricao">Descrição do Produto</label>
      <input type="text" id="trc_descricao" placeholder="Aguardando busca...">
    </div>

    <div class="form-group">
      <label for="trc_quantidade">Quantidade</label>
      <input type="number" id="trc_quantidade" value="1" min="1">
    </div>

    <div class="form-group">
      <label for="trc_motivo">Motivo da Quebra</label>
      <select id="trc_motivo">
        <option value="1">1 - Avaria Operacional</option>
        <option value="2" selected>2 - Vencimento</option>
        <option value="3">3 - Maturação</option>
        <option value="4">4 - Acidentes por Clientes</option>
        <option value="5">5 - Fornecedor</option>
        <option value="6">6 - Equipamento</option>
        <option value="7">7 - Logística</option>
        <option value="8">8 - Transporte Inadequado</option>
      </select>
    </div>

    <button onclick="adicionarItem()">Adicionar Produto</button>
  </div>
</div>

<script>
  // Bases de Dados Locais e Pré-cadastradas
  window.catalogoLocal = window.catalogoLocal || {};
  window.produtosPreCadastrados = window.produtosPreCadastrados || {
    "7898279710910": { nome: "LeitinhoTrufado", img: "" },
    "7894000050034": { nome: "hellmann's maionese", img: "" },
    "7893000079296": { nome: "Margarina Cremosa Com Sal Qualy Pote 1kg Ed", img: "" },
    "7891097000270": { nome: "Iogurte Grego Tradicional Batavo Pote 100g", img: "" }
  };

  function el(id) {
    return document.getElementById(id);
  }

  // --- TRATAMENTO DE IMAGEM DA FOTO ---
  function exibirImagemProduto(prefix, urlImagem) {
    const imgEl = el('fotoProduto');
    const placeholderEl = el('fotoPlaceholder');
    const spinnerEl = el('loadingSpinner');

    if (!urlImagem) {
      ocultarImagemProduto(prefix, 'Sem imagem disponível');
      return;
    }

    let urlSegura = urlImagem.replace(/^http:\/\//i, 'https://');

    spinnerEl.style.display = 'block';
    placeholderEl.style.display = 'none';
    imgEl.style.display = 'none';

    const imgTemp = new Image();
    imgTemp.src = urlSegura;

    imgTemp.onload = function() {
      spinnerEl.style.display = 'none';
      imgEl.src = urlSegura;
      imgEl.style.display = 'block';
    };

    imgTemp.onerror = function() {
      spinnerEl.style.display = 'none';
      ocultarImagemProduto(prefix, 'Erro ao carregar imagem');
    };
  }

  function ocultarImagemProduto(prefix, mensagem = 'Foto do Produto') {
    const imgEl = el('fotoProduto');
    const placeholderEl = el('fotoPlaceholder');
    const spinnerEl = el('loadingSpinner');

    spinnerEl.style.display = 'none';
    imgEl.style.display = 'none';
    imgEl.src = '';
    placeholderEl.textContent = mensagem;
    placeholderEl.style.display = 'block';
  }

  // --- BUSCA AUTOMÁTICA DE PRODUTO POR EAN ---
  async function buscarProduto(modulo) {
    const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
    const codeEl = el(prefix + 'codigo');
    const descEl = el(prefix + 'descricao');
    const statusEl = el(prefix + 'status');
    
    const code = codeEl ? codeEl.value.trim() : '';
    if (!code) {
      if (statusEl) statusEl.innerHTML = '<span class="warn">Informe um código.</span>';
      return;
    }

    if (statusEl) statusEl.innerHTML = '⚡ Buscando produto...';
    ocultarImagemProduto(prefix);

    // 1. Consulta no catálogo local
    if (window.catalogoLocal && window.catalogoLocal[code]) {
      const p = typeof window.catalogoLocal[code] === 'object' 
        ? window.catalogoLocal[code] 
        : { nome: window.catalogoLocal[code], img: '' };
      
      if (descEl) descEl.value = p.nome.replace(/\s+/g, ' ').trim();
      if (p.img) exibirImagemProduto(prefix, p.img);
      if (statusEl) statusEl.innerHTML = '<span class="ok">Localizado no catálogo local!</span>';
      return;
    }

    // 2. Consulta em produtos pré-cadastrados
    if (window.produtosPreCadastrados && window.produtosPreCadastrados[code]) {
      const p = window.produtosPreCadastrados[code];
      if (descEl) descEl.value = p.nome.replace(/\s+/g, ' ').trim();
      if (p.img) exibirImagemProduto(prefix, p.img);
      if (statusEl) statusEl.innerHTML = '<span class="ok">Localizado no sistema!</span>';
      return;
    }

    // 3. Consulta em API Online (OpenFoodFacts BR/World)
    try {
      let res = await fetch(`https://br.openfoodfacts.org/api/v0/product/${code}.json`);
      let data = await res.json();

      if (!data || data.status !== 1 || !data.product) {
        res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${code}.json`);
        data = await res.json();
      }

      if (data && data.status === 1 && data.product) {
        const nome = data.product.product_name_pt || data.product.product_name || data.product.generic_name || '';
        const imgUrl = data.product.image_front_url || data.product.image_url || '';

        if (nome) {
          if (descEl) descEl.value = nome.replace(/\s+/g, ' ').trim();
          if (imgUrl) exibirImagemProduto(prefix, imgUrl);
          if (statusEl) statusEl.innerHTML = '<span class="ok">Encontrado online!</span>';
          return;
        }
      }

      if (statusEl) statusEl.innerHTML = '<span class="warn">Produto não encontrado. Digite a descrição.</span>';
      if (descEl) descEl.focus();

    } catch (err) {
      if (statusEl) statusEl.innerHTML = '<span class="warn">Erro de conexão. Digite a descrição.</span>';
      if (descEl) descEl.focus();
    }
  }

  // --- GERADOR DA PLANILHA EXCEL (ExcelJS) ---
  function preencherPlanilhaExcel(workbook, itensTroca) {
    const sheet = workbook.getWorksheet(1);

    // Começa EXATAMENTE na linha 16 para não sobrescrever o cabeçalho (linha 15)
    itensTroca.forEach((item, index) => {
      const rowNumber = 16 + index; 
      const row = sheet.getRow(rowNumber);

      // CÓDIGO DE BARRAS (Coluna A) - Centralizado
      const cellA = row.getCell(1);
      cellA.value = String(item.codigo || '');
      cellA.alignment = { horizontal: 'center', vertical: 'middle' };

      // DESCRIÇÃO DO PRODUTO (Coluna B) - Alinhado à esquerda e sem espaços duplos
      const cellB = row.getCell(2);
      cellB.value = (item.descricao || '').replace(/\s+/g, ' ').trim();
      cellB.alignment = { horizontal: 'left', vertical: 'middle', wrapText: true };

      // QUANTIDADE (Coluna C) - Centralizado
      const cellC = row.getCell(3);
      cellC.value = Number(item.quantidade) || 0;
      cellC.alignment = { horizontal: 'center', vertical: 'middle' };

      // MOTIVO (Coluna D) - Centralizado
      const cellD = row.getCell(4);
      cellD.value = Number(item.motivo) || 1;
      cellD.alignment = { horizontal: 'center', vertical: 'middle' };

      row.commit();
    });
  }

  function adicionarItem() {
    alert("Item adicionado com sucesso!");
  }
</script>

</body>
</html>
