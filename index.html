<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Trocas</title>
  <style>
    /* Estilos globais básicos */
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* Container Quadrado para a Imagem do Produto */
    .imagem-container {
      width: 100%;
      max-width: 280px; /* Ajuste a largura máxima desejada */
      aspect-ratio: 1 / 1; /* Garante que o espaço seja SEMPRE quadrado */
      margin: 12px auto;
      background-color: #e9ecef;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Tag de Imagem */
    .imagem-container img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Preenche todo o quadrado sem distorcer */
      display: none; /* Escondida até carregar com sucesso */
    }

    /* Texto/Placeholder enquanto não há imagem ou em caso de erro */
    .imagem-placeholder {
      color: #6c757d;
      font-size: 14px;
      text-align: center;
      padding: 8px;
    }

    /* Loader simples durante a busca */
    .spinner {
      display: none;
      width: 32px;
      height: 32px;
      border: 3px solid #ccc;
      border-top-color: #007bff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>✏️ 2. Dados da Troca</h2>

    <!-- Container da Imagem -->
    <div class="imagem-container">
      <div id="loadingSpinner" class="spinner"></div>
      <span id="fotoPlaceholder" class="imagem-placeholder">Foto do Produto</span>
      <img id="fotoProduto" src="" alt="Foto do Produto">
    </div>

    <!-- Outros campos -->
    <label for="descricao">Descrição do produto</label>
    <input type="text" id="descricao" readonly placeholder="Aguardando busca...">
  </div>

  <script>
    function carregarImagemProduto(urlImagem) {
      const imgEl = document.getElementById('fotoProduto');
      const placeholderEl = document.getElementById('fotoPlaceholder');
      const spinnerEl = document.getElementById('loadingSpinner');

      if (!urlImagem) {
        mostrarPlaceholder('Sem imagem disponível');
        return;
      }

      // 1. Forçar HTTPS para evitar bloqueio de Mixed Content no GitHub Pages
      let urlSegura = urlImagem.replace(/^http:\/\//i, 'https://');

      // Exibir o spinner de carregamento
      spinnerEl.style.display = 'block';
      placeholderEl.style.display = 'none';
      imgEl.style.display = 'none';

      // Criar objeto de imagem em memória para validar o carregamento antes de exibir
      const imgTemp = new Image();
      imgTemp.src = urlSegura;

      imgTemp.onload = function() {
        // Sucesso ao carregar
        spinnerEl.style.display = 'none';
        imgEl.src = urlSegura;
        imgEl.style.display = 'block';
      };

      imgTemp.onerror = function() {
        // Falha no carregamento (ex: Erro 404 ou CORS)
        spinnerEl.style.display = 'none';
        mostrarPlaceholder('Erro ao carregar imagem');
      };
    }

    function mostrarPlaceholder(mensagem) {
      const imgEl = document.getElementById('fotoProduto');
      const placeholderEl = document.getElementById('fotoPlaceholder');
      const spinnerEl = document.getElementById('loadingSpinner');

      spinnerEl.style.display = 'none';
      imgEl.style.display = 'none';
      imgEl.src = '';
      placeholderEl.textContent = mensagem;
      placeholderEl.style.display = 'block';
    }

    // Exemplo de integração na sua função de busca do produto:
    /*
    function aoBuscarProduto(dadosProduto) {
      document.getElementById('descricao').value = dadosProduto.nome;
      carregarImagemProduto(dadosProduto.url_foto);
    }
    */
  </script>
</body>
</html>
