<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coletor Pró Ativo - Rede Market</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 15px; background: #f4f4f9; }
    .card { background: #fff; padding: 15px; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 10px; }
    label { font-weight: bold; display: block; margin-bottom: 3px; font-size: 14px; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    button.export { background: #28a745; margin-top: 10px; }
    .file-input-wrapper { background: #e9ecef; border: 1px dashed #6c757d; padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: left; }
    th { background: #eee; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="card">
  <h3>Coletor de Dados - Pró Ativo</h3>

  <!-- PASSO 1: Selecionar a Planilha Modelo -->
  <div class="file-input-wrapper">
    <label for="excelFile">1º Selecione o modelo (.xlsx):</label>
    <input type="file" id="excelFile" accept=".xlsx, .xls">
  </div>

  <!-- PASSO 2: Formulário de Entrada -->
  <div class="form-group">
    <label>Loja</label>
    <input type="text" id="loja" value="PATITIBA">
  </div>

  <div class="form-group">
    <label>Código do Produto</label>
    <input type="text" id="codigo" placeholder="Bip/Digite o código" autofocus>
  </div>

  <div class="form-group">
    <label>Descrição do Produto</label>
    <input type="text" id="descricao" placeholder="Nome do produto">
  </div>

  <div class="form-group">
    <label>Qtd no Estoque</label>
    <input type="number" id="qtd" step="any">
  </div>

  <div class="form-group">
    <label>Unidade / Caixa / Fardo</label>
    <select id="unidade">
      <option value="und">und</option>
      <option value="cx">cx</option>
      <option value="fd">fd</option>
      <option value="kg">kg</option>
    </select>
  </div>

  <div class="form-group">
    <label>Data de Validade</label>
    <input type="text" id="validade" placeholder="DD/MM/AAAA">
  </div>

  <div class="form-group">
    <label>Valor Unitário (R$)</label>
    <input type="number" id="valor" step="0.01" value="0.00">
  </div>

  <button type="button" onclick="adicionarItem()">Adicionar Item</button>
  <button type="button" class="export" onclick="salvarNaPlanilha()">2º Salvar na Planilha</button>

  <table>
    <thead>
      <tr>
        <th>Nº</th>
        <th>Código</th>
        <th>Descrição</th>
        <th>Qtd</th>
      </tr>
    </thead>
    <tbody id="listaCorpo"></tbody>
  </table>
</div>

<script>
  let templateWorkbook = null;
  const listaItens = [];

  // Leitura da planilha modelo enviada pelo usuário
  document.getElementById('excelFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(evt) {
      const data = new Uint8Array(evt.target.result);
      templateWorkbook = XLSX.read(data, { type: 'array' });
      alert('Planilha modelo carregada com sucesso!');
    };
    reader.readAsArrayBuffer(file);
  });

  function adicionarItem() {
    const loja = document.getElementById('loja').value;
    const codigo = document.getElementById('codigo').value;
    const descricao = document.getElementById('descricao').value;
    const qtd = document.getElementById('qtd').value;
    const unidade = document.getElementById('unidade').value;
    const validade = document.getElementById('validade').value;
    const valor = parseFloat(document.getElementById('valor').value || 0);

    if (!codigo || !qtd) {
      alert('Preencha pelo menos o Código e a Quantidade!');
      return;
    }

    listaItens.push({
      itemNum: listaItens.length + 1,
      comprador: '',
      loja: loja,
      codigo: codigo,
      descricao: descricao,
      qtd: Number(qtd),
      unidade: unidade,
      validade: validade,
      valor: valor
    });

    renderTabela();
    limparCampos();
  }

  function renderTabela() {
    const tbody = document.getElementById('listaCorpo');
    tbody.innerHTML = '';
    listaItens.forEach(item => {
      tbody.innerHTML += `<tr>
        <td>${item.itemNum}</td>
        <td>${item.codigo}</td>
        <td>${item.descricao}</td>
        <td>${item.qtd}</td>
      </tr>`;
    });
  }

  function limparCampos() {
    document.getElementById('codigo').value = '';
    document.getElementById('descricao').value = '';
    document.getElementById('qtd').value = '';
    document.getElementById('codigo').focus();
  }

  function salvarNaPlanilha() {
    if (listaItens.length === 0) {
      alert('Adicione itens antes de salvar!');
      return;
    }

    if (!templateWorkbook) {
      alert('Selecione o arquivo modelo (.xlsx) no topo da tela antes de salvar!');
      return;
    }

    // Pega a primeira aba da planilha modelo
    const sheetName = templateWorkbook.SheetNames[0];
    const worksheet = templateWorkbook.Sheets[sheetName];

    // Mapeamento correto a partir da Linha 7 da imagem
    listaItens.forEach((item, index) => {
      const rowIndex = 7 + index; // Linha 7 em diante (7, 8, 9...)

      XLSX.utils.sheet_add_aoa(worksheet, [[
        item.itemNum,   // Coluna A (Índice / Item)
        item.comprador, // Coluna B (Comprador)
        item.loja,      // Coluna C (Loja - PATITIBA)
        item.codigo,    // Coluna D (Código de Produto)
        item.descricao, // Coluna E (Descrição)
        item.qtd,       // Coluna F (Quantidade no Estoque)
        item.unidade,   // Coluna G (Unidade / Caixa / Fardo)
        item.validade,  // Coluna H (Data de Validade)
        item.valor      // Coluna I (Valor Unitário)
      ]], { origin: `A${rowIndex}` });
    });

    // Gera o download do arquivo preenchido
    XLSX.writeFile(templateWorkbook, "Pro_Ativo_Frios_Preenchido.xlsx");
  }
</script>

</body>
</html>
