<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gestão de Trocas - Rede Market</title>

  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333333;
      padding-bottom: 30px;
    }

    /* BARRA SUPERIOR ORIGINAL */
    .header-bar {
      background-color: #0d2238;
      color: #ffffff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo img {
      height: 32px;
      background: #fff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: bold;
    }

    .brand-sub {
      font-size: 11px;
      color: #a0aec0;
    }

    .header-right {
      display: flex;
      gap: 8px;
    }

    .badge-loja {
      background: rgba(255,255,255,0.15);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .btn-menu {
      background: #ffffff;
      color: #0d2238;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    /* CONTAINER PRINCIPAL DO FORMULÁRIO */
    .container {
      max-width: 500px;
      margin: 16px auto;
      padding: 0 12px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      border: 1px solid #e2e8f0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      background-color: #fff;
    }

    .form-control:focus {
      border-color: #0066cc;
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: #1a202c;
    }

    /* BOTOES DA CÂMERA */
    .btn-action {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #0066cc;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-secondary {
      background-color: #edf2f7;
      color: #2b6cb0;
      border: 1px solid #cbd5e0;
    }

    .box-scanner-area {
      border: 2px dashed #cbd5e0;
      border-radius: 10px;
      padding: 12px;
      text-align: center;
      background: #f7fafc;
    }

    /* ÁREA DO PRODUTO ENCONTRADO */
    .product-preview {
      margin-top: 16px;
      text-align: center;
      display: none;
    }

    .product-preview img {
      max-width: 180px;
      max-height: 180px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-top: 8px;
    }

    /* OVERLAY DA CÂMERA CLEAN (SEM EMBAÇADO/TINTA ESCURA) */
    .camera-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000000;
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    .camera-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.4);
    }

    .camera-header button {
      background: none;
      border: none;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .camera-tabs {
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .camera-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* QUADRADINHO / MOLDURA CLEAN DE LEITURA */
    .scan-target {
      position: absolute;
      width: 280px;
      height: 160px;
      z-index: 5;
      pointer-events: none;
    }

    .corner {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: #ffffff;
      border-style: solid;
    }

    .c-top-left { top: 0; left: 0; border-width: 3px 0 0 3px; border-top-left-radius: 8px; }
    .c-top-right { top: 0; right: 0; border-width: 3px 3px 0 0; border-top-right-radius: 8px; }
    .c-bottom-left { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-bottom-left-radius: 8px; }
    .c-bottom-right { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-bottom-right-radius: 8px; }

    .camera-footer {
      position: absolute;
      bottom: 25px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .btn-close-cam {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="brand-logo">
      <div class="brand-title">Gestão de Trocas</div>
      <div class="brand-sub">Devoluções</div>
    </div>
    <div class="header-right">
      <span class="badge-loja">PATITIBA</span>
      <button class="btn-menu">Menu</button>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="form-group">
        <label for="conferente">Conferente / Responsável</label>
        <input type="text" id="conferente" class="form-control" placeholder="Seu nome">
      </div>

      <div class="form-group">
        <label for="fornecedor">Fornecedor</label>
        <input type="text" id="fornecedor" class="form-control" placeholder="Ex: Ambev, Nestlé">
      </div>

      <div class="form-group">
        <label for="motivo">Motivo da Troca *</label>
        <select id="motivo" class="form-control">
          <option value="1">1 - Avaria</option>
          <option value="2">2 - Vencimento</option>
          <option value="3">3 - Defeito de Fabricação</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dataTroca">Data da Troca</label>
        <input type="date" id="dataTroca" class="form-control">
      </div>
    </div>

    <div class="card">
      <div class="section-title">📷 1. Escanear produto</div>
      
      <div class="box-scanner-area">
        <button class="btn-action" onclick="abrirCameraUltraHD()">📷 Abrir Câmera no Navegador</button>
      </div>

      <div class="form-group" style="margin-top: 14px;">
        <label for="barcodeInput">Código de barras</label>
        <input type="number" id="barcodeInput" class="form-control" placeholder="Ex.: 789..." pattern="[0-9]*">
      </div>

      <button class="btn-action" onclick="executarBuscaManual()">🔍 Buscar produto</button>

      <div id="productResult" class="product-preview">
        <h4 id="productTitle">Nome do Produto</h4>
        <img id="productImage" src="" alt="Foto do Produto">

        <div class="form-group" style="margin-top: 12px; text-align: left;">
          <label for="validadeProduto">Data de Validade / Vencimento:</label>
          <input type="date" id="validadeProduto" class="form-control">
        </div>
      </div>
    </div>
  </div>

  <div id="cameraOverlay" class="camera-overlay">
    <div class="camera-header">
      <button onclick="fecharCamera()">←</button>
      <span class="camera-tabs">ESCANEAR CÓDIGO</span>
      <div style="width: 24px;"></div>
    </div>

    <div class="camera-viewport">
      <video id="videoElement" autoplay playsinline muted></video>
      <div class="scan-target">
        <div class="corner c-top-left"></div>
        <div class="corner c-top-right"></div>
        <div class="corner c-bottom-left"></div>
        <div class="corner c-bottom-right"></div>
      </div>
    </div>

    <div class="camera-footer">
      <button class="btn-close-cam" onclick="fecharCamera()">Adicionar sem código de barras</button>
    </div>
  </div>

  <script>
    let codeReader = null;
    let currentStream = null;

    window.addEventListener('DOMContentLoaded', () => {
      codeReader = new ZXing.BrowserMultiFormatReader();
      // Define a data de hoje por padrão
      document.getElementById('dataTroca').valueAsDate = new Date();
    });

    async function abrirCameraUltraHD() {
      document.getElementById('cameraOverlay').style.display = 'flex';

      // Configurações de alta resolução (Full HD / 4K)
      const constraints = {
        video: {
          facingMode: { exact: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        }
      };

      try {
        const videoElement = document.getElementById('videoElement');
        
        // Tenta pegar acesso direto com parâmetros de alta qualidade
        try {
          currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch(e) {
          // Fallback caso a traseira estrita falhe
          currentStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        }

        videoElement.srcObject = currentStream;

        // Aplica o Zoom de 2.5x na câmera se o dispositivo/navegador suportar
        const track = currentStream.getVideoTracks()[0];
        if (track && 'applyConstraints' in track) {
          const capabilities = track.getCapabilities ? track.getCapabilities() : {};
          if (capabilities.zoom) {
            const targetZoom = Math.min(2.5, capabilities.zoom.max || 2.5);
            track.applyConstraints({ advanced: [{ zoom: targetZoom }] }).catch(() => {});
          }
        }

        // Inicia decodificação contínua do vídeo
        codeReader.decodeFromStream(currentStream, 'videoElement', (result, err) => {
          if (result) {
            if (navigator.vibrate) navigator.vibrate(100);

            const ean = result.text;
            fecharCamera();

            const input = document.getElementById('barcodeInput');
            input.value = ean;
            input.blur(); // Recolhe o teclado suspenso imediatamente

            buscarProduto(ean);
          }
        });

      } catch (err) {
        alert("Erro ao acessar câmera: " + err.message);
        fecharCamera();
      }
    }

    function fecharCamera() {
      if (codeReader) {
        codeReader.reset();
      }
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('cameraOverlay').style.display = 'none';
    }

    function executarBuscaManual() {
      const input = document.getElementById('barcodeInput');
      input.blur(); // Recua o teclado
      if (input.value) {
        buscarProduto(input.value);
      }
    }

    async function buscarProduto(codigo) {
      const resultArea = document.getElementById('productResult');
      const titleElem = document.getElementById('productTitle');
      const imgElem = document.getElementById('productImage');
      const validadeInput = document.getElementById('validadeProduto');

      resultArea.style.display = 'block';
      titleElem.innerText = "Buscando produto...";
      imgElem.src = "";

      try {
        const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${codigo}.json`);
        const data = await response.json();

        if (data.status === 1 && data.product) {
          titleElem.innerText = data.product.product_name || "Produto Localizado";
          imgElem.src = data.product.image_front_url || "https://via.placeholder.com/150?text=Sem+Foto";
        } else {
          titleElem.innerText = "Produto não cadastrado na base";
          imgElem.src = "https://via.placeholder.com/150?text=Sem+Foto";
        }
      } catch (e) {
        titleElem.innerText = "Código capturado: " + codigo;
        imgElem.src = "https://via.placeholder.com/150?text=Sem+Foto";
      }

      // Preenche/Abre calendário de validade
      validadeInput.valueAsDate = new Date();
      validadeInput.focus();
    }
  </script>
</body>
</html>
