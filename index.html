<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leitor de Código de Barras</title>

  <!-- Biblioteca ZXing para leitura rápida de código de barras via câmera -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR */
    .app-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #1e1e1e;
      border-bottom: 1px solid #2d2d2d;
    }

    .app-bar h1 {
      font-size: 18px;
      font-weight: 600;
    }

    /* ÁREA PRINCIPAL */
    .container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
    }

    /* CAMPO DE FORMULÁRIO DE ENTRADA DO CÓDIGO */
    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-group input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3d3d3d;
      background-color: #242424;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .btn {
      background-color: #007aff;
      color: white;
      border: none;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      opacity: 0.8;
    }

    /* CARTÃO DE DETALHES DO PRODUTO */
    .product-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #2d2d2d;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-header {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .product-img {
      width: 90px;
      height: 90px;
      border-radius: 8px;
      object-fit: cover;
      background-color: #2a2a2a;
      border: 1px solid #3a3a3a;
    }

    .product-info {
      flex: 1;
    }

    .product-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .product-code {
      font-size: 13px;
      color: #8e8e93;
    }

    /* SEÇÃO DO CALENDÁRIO / VALIDADE */
    .date-section {
      background-color: #262626;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .date-section label {
      font-size: 13px;
      color: #aaaaaa;
      font-weight: 500;
    }

    .date-section input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3d3d3d;
      background-color: #1a1a1a;
      color: #ffffff;
      font-size: 16px;
      color-scheme: dark;
    }

    /* TELA DO SCANNER DA CÂMERA (ESTILO BEEP) */
    .scanner-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      display: none;
      flex-direction: column;
    }

    .scanner-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .scanner-header .btn-back {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
    }

    .scanner-tabs {
      display: flex;
      gap: 16px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .scanner-tabs .active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

    .scanner-tabs .inactive {
      color: #8e8e93;
    }

    .scanner-viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scanner-viewport video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MOLDURA CENTRAL ESTILO BEEP */
    .scan-box {
      position: absolute;
      width: 260px;
      height: 160px;
      border-radius: 12px;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
      z-index: 5;
    }

    .scan-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: #ffffff;
      border-style: solid;
    }

    .top-left { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
    .top-right { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
    .bottom-left { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
    .bottom-right { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }

    .watermark-beep {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 12px;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.8);
      letter-spacing: 1px;
    }

    /* BOTÃO INFERIOR CÂMERA */
    .scanner-footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
    }

    .btn-no-barcode {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <div class="app-bar">
    <h1>Coletor de Estoque</h1>
    <button class="btn" onclick="abrirCamera()">📷 Câmera</button>
  </div>

  <div class="container">
    <!-- Entrada manual / Leitura -->
    <form id="barcodeForm" onsubmit="processarCodigoBarra(event)">
      <div class="input-group">
        <input type="number" id="barcodeInput" placeholder="Código de barras..." pattern="[0-9]*">
        <button type="submit" class="btn">Buscar</button>
      </div>
    </form>

    <!-- Detalhes do Produto (Aparece logo abaixo) -->
    <div id="productCard" class="product-card" style="display: none;">
      <div class="product-header">
        <img id="productImage" class="product-img" src="" alt="Produto">
        <div class="product-info">
          <div id="productTitle" class="product-title">Nome do Produto</div>
          <div id="productEan" class="product-code">EAN: -</div>
        </div>
      </div>

      <!-- Calendário automático para Vencimento/Validade -->
      <div class="date-section">
        <label for="expiryDate">Data de Vencimento / Validade:</label>
        <input type="date" id="expiryDate">
      </div>

      <button class="btn" style="background-color: #34c759;" onclick="salvarItem()">Confirmar e Salvar</button>
    </div>
  </div>

  <!-- OVERLAY DA CÂMERA ESTILO BEEP -->
  <div id="scannerOverlay" class="scanner-overlay">
    <div class="scanner-header">
      <button class="btn-back" onclick="fecharCamera()">←</button>
      <div class="scanner-tabs">
        <span class="active">Escanear...</span>
        <span class="inactive" onclick="focarEntradaManual()">DIGITAR MANUALMENTE</span>
      </div>
      <div style="width: 24px;"></div>
    </div>

    <div class="scanner-viewport">
      <video id="videoPreview"></video>
      <div class="scan-box">
        <div class="scan-corner top-left"></div>
        <div class="scan-corner top-right"></div>
        <div class="scan-corner bottom-left"></div>
        <div class="scan-corner bottom-right"></div>
        <div class="watermark-beep">BEEP</div>
      </div>
    </div>

    <div class="scanner-footer">
      <button class="btn-no-barcode" onclick="fecharCamera()">Adicionar sem código de barras</button>
    </div>
  </div>

  <script>
    let codeReader = null;

    // Inicialização da leitura automática
    window.addEventListener('DOMContentLoaded', () => {
      codeReader = new ZXing.BrowserMultiFormatReader();
    });

    // Abrir câmera com layout BEEP
    async function abrirCamera() {
      document.getElementById('scannerOverlay').style.display = 'flex';

      try {
        const videoInputDevices = await codeReader.listVideoInputDevices();
        // Seleciona a câmera traseira preferencialmente
        const rearCamera = videoInputDevices.find(device => 
          device.label.toLowerCase().includes('back') || 
          device.label.toLowerCase().includes('traseira') ||
          device.label.toLowerCase().includes('environment')
        ) || videoInputDevices[0];

        codeReader.decodeFromVideoDevice(rearCamera.deviceId, 'videoPreview', (result, err) => {
          if (result) {
            // Vibração ao ler
            if (navigator.vibrate) navigator.vibrate(100);

            const eanLido = result.text;
            fecharCamera();

            // Preenche o campo de texto
            const inputField = document.getElementById('barcodeInput');
            inputField.value = eanLido;

            // Recua o teclado ocultando o foco do campo
            inputField.blur();

            // Executa a busca imediatamente (Simulando o Enter)
            buscarProduto(eanLido);
          }
        });
      } catch (err) {
        alert('Erro ao acessar a câmera: ' + err);
        fecharCamera();
      }
    }

    function fecharCamera() {
      if (codeReader) {
        codeReader.reset();
      }
      document.getElementById('scannerOverlay').style.display = 'none';
    }

    function focarEntradaManual() {
      fecharCamera();
      const input = document.getElementById('barcodeInput');
      input.focus();
    }

    function processarCodigoBarra(e) {
      e.preventDefault();
      const inputField = document.getElementById('barcodeInput');
      inputField.blur(); // Recolhe o teclado suspenso
      if (inputField.value) {
        buscarProduto(inputField.value);
      }
    }

    // Consulta de produto na base (exemplo Open Food Facts + Callback)
    async function buscarProduto(codigo) {
      document.getElementById('productCard').style.display = 'block';
      document.getElementById('productTitle').innerText = "Carregando...";
      document.getElementById('productEan').innerText = "EAN: " + codigo;
      document.getElementById('productImage').src = "";

      try {
        const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${codigo}.json`);
        const data = await res.json();

        if (data.status === 1 && data.product) {
          const produto = data.product;
          document.getElementById('productTitle').innerText = produto.product_name || "Produto Encontrado";
          document.getElementById('productImage').src = produto.image_front_url || "https://via.placeholder.com/90?text=Sem+Foto";
        } else {
          document.getElementById('productTitle').innerText = "Produto Não Cadastrado";
          document.getElementById('productImage').src = "https://via.placeholder.com/90?text=Sem+Foto";
        }
      } catch (err) {
        document.getElementById('productTitle').innerText = "Produto Registrado (Off-line)";
        document.getElementById('productImage').src = "https://via.placeholder.com/90?text=Erro";
      }

      // Preenche o calendário com a data padrão de hoje para facilitar
      const dateInput = document.getElementById('expiryDate');
      if (!dateInput.value) {
        dateInput.valueAsDate = new Date();
      }
      
      // Abre/Foca a data automaticamente caso o navegador suporte
      dateInput.focus();
    }

    function salvarItem() {
      const ean = document.getElementById('barcodeInput').value;
      const nome = document.getElementById('productTitle').innerText;
      const dataValidade = document.getElementById('expiryDate').value;

      if (!dataValidade) {
        alert('Por favor, informe a data de vencimento.');
        return;
      }

      alert(`Produto salvo!\nEAN: ${ean}\nNome: ${nome}\nValidade: ${dataValidade}`);
      
      // Limpa a tela para o próximo
      document.getElementById('productCard').style.display = 'none';
      document.getElementById('barcodeInput').value = '';
    }
  </script>
</body>
</html>
