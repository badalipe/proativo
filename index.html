<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor e Controle</title>
    <!-- Inclua a biblioteca html5-qrcode no seu head se já não tiver -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .hidden { display: none !important; }
        #beep-scanner-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        #beep-reader {
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <!-- Exemplo de Botão para chamar o scanner -->
    <button onclick="abrirScanner('proativo')">Abrir Câmera / Escanear</button>

    <!-- Inputs de exemplo -->
    <div>
        <input type="text" id="pro_codigo" placeholder="Código de barras aparecerá aqui">
        <input type="date" id="pro_validade" placeholder="Validade">
    </div>

    <!-- Overlay do Scanner -->
    <div id="beep-scanner-overlay" class="hidden">
        <div id="beep-reader"></div>
        <div style="margin-top: 20px;">
            <button onclick="pararScanner()" style="padding: 12px 24px; background: #ff4444; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer;">Fechar Câmera</button>
        </div>
    </div>

    <script>
        let html5QrCode = null;
        let moduloAtual = null;
        window.isScanningPaused = false;

        function el(id) {
            return document.getElementById(id);
        }

        function tocarBipe() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {
                // Áudio não suportado ou bloqueado por interação
            }
        }

        function dispararFlashScan() {
            const overlay = el('beep-scanner-overlay');
            if (overlay) {
                overlay.style.backgroundColor = 'rgba(255,255,255,0.8)';
                setTimeout(() => {
                    overlay.style.backgroundColor = 'rgba(0,0,0,0.9)';
                }, 100);
            }
        }

        async function abrirScanner(modulo) {
            moduloAtual = modulo;
            const overlay = el('beep-scanner-overlay');
            overlay.classList.remove('hidden');
            
            await new Date(); // Pequeno respiro

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("beep-reader");
            }
            
            // Configuração essencial cobrindo códigos de supermercado e QR Codes
            const config = { 
                fps: 15, 
                qrbox: { width: 300, height: 160 },
                formatsToSupport: [ 
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.QR_CODE
                ]
            };
            
            const aoLerComSucesso = async (decodedText) => {
                if (window.isScanningPaused) return;
                window.isScanningPaused = true;

                tocarBipe();
                dispararFlashScan();
                
                const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
                const campoCodigo = el(prefix + 'codigo');
                
                if (campoCodigo) {
                    campoCodigo.value = decodedText;
                    campoCodigo.dispatchEvent(new Event('input', { bubbles: true }));
                    campoCodigo.dispatchEvent(new Event('change', { bubbles: true }));
                }
                
                pararScanner();
                
                // Exemplo de chamada caso tenha função de busca:
                // await buscarProduto(modulo);
                
                setTimeout(() => {
                    window.isScanningPaused = false;
                    const campoValidade = el(prefix + 'validade');
                    if (campoValidade) {
                        campoValidade.focus();
                        if (campoValidade.showPicker) {
                            try { campoValidade.showPicker(); } catch(err) {}
                        }
                    }
                }, 250);
            };

            const aoErroLeitura = (errorMessage) => {
                // Ignora erros de quadros vazios para manter a leitura fluida
            };

            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    aoLerComSucesso,
                    aoErroLeitura
                );
            } catch (err) {
                try {
                    await html5QrCode.start(
                        { facingMode: "user" }, 
                        config, 
                        aoLerComSucesso,
                        aoErroLeitura
                    );
                } catch (innerErr) {
                    alert("Erro ao iniciar a câmera: " + innerErr);
                    pararScanner();
                }
            }
        }

        async function pararScanner() {
            if (html5QrCode) {
                try {
                    if (html5QrCode.isScanning) {
                        await html5QrCode.stop();
                    }
                } catch (err) {
                    console.error("Erro ao parar scanner:", err);
                }
            }
            const overlay = el('beep-scanner-overlay');
            if (overlay) {
                overlay.classList.add('hidden');
            }
            window.isScanningPaused = false;
        }
    </script>
</body>
</html>
