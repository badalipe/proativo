<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Escanear Código de Barras</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Container principal ocupando 100% da tela */
    .scanner-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 1;
    }

    /* Elemento da câmera ocupando todo o fundo */
    .scanner-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Interface sobreposta à câmera */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    /* Cabeçalho superior */
    .header {
      display: flex;
      align-items: center;
      padding: 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
      pointer-events: auto;
    }

    .btn-back {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      margin-right: 12px;
    }

    .nav-tabs {
      display: flex;
      gap: 16px;
    }

    .nav-tab {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      opacity: 0.8;
    }

    .nav-tab.active {
      opacity: 1;
      border-bottom: 2px solid #fff;
      padding-bottom: 2px;
    }

    /* Guia visual / Moldura central do scanner */
    .scan-area {
      position: relative;
      width: 80vw;
      height: 50vh;
      margin: auto;
    }

    /* Cantos brancos arredondados */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #ffffff;
      border-style: solid;
    }

    .top-left {
      top: 0;
      left: 0;
      border-width: 4px 0 0 4px;
      border-top-left-radius: 12px;
    }

    .top-right {
      top: 0;
      right: 0;
      border-width: 4px 4px 0 0;
      border-top-right-radius: 12px;
    }

    .bottom-left {
      bottom: 0;
      left: 0;
      border-width: 0 0 4px 4px;
      border-bottom-left-radius: 12px;
    }

    .bottom-right {
      bottom: 0;
      right: 0;
      border-width: 0 4px 4px 0;
      border-bottom-right-radius: 12px;
    }

    /* Indicador visual BEEP */
    .beep-indicator {
      position: absolute;
      right: 15px;
      bottom: 25px;
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
    }

    .beep-indicator::after {
      content: '';
      display: inline-block;
      width: 12px;
      height: 2px;
      background-color: #ff3b30;
      margin-left: 4px;
    }

    /* Rodapé com botão */
    .footer {
      padding: 24px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      display: flex;
      justify-content: center;
      pointer-events: auto;
    }

    .btn-action {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      backdrop-filter: blur(4px);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="scanner-container">
    <!-- Câmera do dispositivo em tela cheia -->
    <video id="webcam" autoplay playsinline muted></video>

    <!-- Overlay com os elementos visuais da interface -->
    <div class="overlay">
      <header class="header">
        <button class="btn-back">&#8592;</button>
        <nav class="nav-tabs">
          <span class="nav-tab active">Escanear...</span>
          <span class="nav-tab">DIGITAR MANUALMENTE</span>
        </nav>
      </header>

      <!-- Moldura para o código de barras com bordas nos cantos -->
      <div class="scan-area">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
        <div class="beep-indicator">BEEP</div>
      </div>

      <footer class="footer">
        <button class="btn-action">Adicionar sem código de barras</button>
      </footer>
    </div>
  </div>

  <script>
    // Inicialização da Câmera
    async function startCamera() {
      const videoElement = document.getElementById('webcam');
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }, // Preferência para câmera traseira
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });

        videoElement.srcObject = stream;
      } catch (error) {
        console.error("Erro ao acessar a câmera: ", error);
      }
    }

    // Inicia a câmera ao carregar a página
    window.addEventListener('DOMContentLoaded', startCamera);
  </script>

</body>
</html>
