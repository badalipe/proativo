<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Trocas - Rede Market</title>
  <style>
    :root {
      --primary: #0066b2;
      --primary-dark: #004d86;
      --bg-dark: #121212;
      --card-bg: #1e1e1e;
      --text: #ffffff;
      --text-muted: #aaa;
      --border: #333;
      --success: #28a745;
      --warning: #ffc107;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .header {
      width: 100%;
      max-width: 500px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 15px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title {
      font-size: 1.1rem;
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background-color: #2a2a2a;
      color: #fff;
      font-size: 0.95rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: var(--primary);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn:active {
      background-color: var(--primary-dark);
    }

    .btn-camera {
      margin-bottom: 10px;
      background-color: #0275d8;
    }

    .status-msg {
      font-size: 0.85rem;
      margin-top: 5px;
    }

    .status-msg .ok { color: var(--success); }
    .status-msg .warn { color: var(--warning); }

    .img-preview-container {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .img-preview {
      max-width: 150px;
      max-height: 150px;
      border-radius: 8px;
      object-fit: cover;
      display: none;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-container">
      <span class="title">Gestão de Trocas</span>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div class="card-title">📷 1. Escanear produto</div>
      
      <button class="btn btn-camera" onclick="abrirCamera('pro_')">
        📷 Abrir câmera para escanear
      </button>

      <div class="form-group">
        <label for="pro_codigo">Código de barras</label>
        <input type="number" id="pro_codigo" placeholder="Ex.: 789..." oninput="tratarDigitacao('pro_')">
      </div>

      <button class="btn" onclick="buscarProduto('proativo')">
        🔍 Buscar produto
      </button>

      <div id="pro_status" class="status-msg"></div>
    </div>

    <div class="card">
      <div class="card-title">✏️ 2. Dados da Troca</div>

      <div class="img-preview-container">
        <img id="pro_img" class="img-preview" alt="Foto do Produto" src="">
      </div>

      <div class="form-group">
        <label for="pro_descricao">Descrição do produto</label>
        <input type="text" id="pro_descricao" placeholder="Descrição do produto">
      </div>

      <div class="form-group">
        <label for="pro_qtd">Quantidade a trocar *</label>
        <input type="number" id="pro_qtd" placeholder="Ex.: 5">
      </div>
    </div>
  </div>

  <script>
    // Atalho para elementos
    const el = id => document.getElementById(id);

    // Banco local com descrições e URLs de imagens
    const catalogoLocal = {
      "7896089011357": {
        nome: "Café Pilão Tradicional A Vácuo 500g",
        img: "https://images.weserv.nl/?url=m.media-amazon.com/images/I/71wZqXyG2BL._AC_SL1500_.jpg&w=500&h=500&fit=cover"
      },
      "7891024136409": {
        nome: "Enxaguante Bucal Colgate Plax",
        img: ""
      },
      "7893000079298": {
        nome: "Margarina Cremosa Com Sal Qualy Pote 1kg",
        img: ""
      }
    };

    const produtosPreCadastrados = {};

    function exibirImagemProduto(prefix, url) {
      const imgEl = el(prefix + 'img');
      if (imgEl) {
        imgEl.src = url;
        imgEl.style.display = 'block';
      }
    }

    function ocultarImagemProduto(prefix) {
      const imgEl = el(prefix + 'img');
      if (imgEl) {
        imgEl.src = '';
        imgEl.style.display = 'none';
      }
    }

    function tratarDigitacao(prefix) {
      ocultarImagemProduto(prefix);
      el(prefix + 'status').innerHTML = '';
    }

    function abrirCamera(prefix) {
      alert("Abertura de câmera integrada ao leitor.");
    }

    // Função principal de busca de produtos
    async function buscarProduto(modulo) {
      const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
      const code = el(prefix + 'codigo').value.trim().replace(/\D/g, '');
      const statusEl = el(prefix + 'status');
      
      ocultarImagemProduto(prefix);

      if (!code) {
        statusEl.innerHTML = '<span class="warn">Informe um código.</span>';
        return;
      }
      
      statusEl.innerHTML = '⚡ Buscando...';
      
      // 1. Verificação no catálogo local do usuário
      if (catalogoLocal[code]) {
        const p = typeof catalogoLocal[code] === 'object' ? catalogoLocal[code] : { nome: catalogoLocal[code], img: '' };
        el(prefix + 'descricao').value = p.nome;
        if (p.img) {
          exibirImagemProduto(prefix, p.img);
        } else {
          buscarImagemGenerica(prefix, p.nome);
        }
        statusEl.innerHTML = '<span class="ok">Localizado no catálogo local!</span>';
        return;
      }
      
      // 2. Verificação nos pré-cadastrados do sistema
      if (produtosPreCadastrados[code]) {
        const p = produtosPreCadastrados[code];
        el(prefix + 'descricao').value = p.nome;
        if (p.img) {
          exibirImagemProduto(prefix, p.img);
        } else {
          buscarImagemGenerica(prefix, p.nome);
        }
        statusEl.innerHTML = '<span class="ok">Localizado na base do sistema!</span>';
        return;
      }
      
      // 3. Busca na API do Open Food Facts
      try {
        let res = await fetch(`https://br.openfoodfacts.org/api/v0/product/${code}.json`);
        let data = await res.json();
        
        if (data && data.status === 1 && data.product) {
          const nome = data.product.product_name_pt || data.product.product_name || data.product.generic_name || '';
          const imgUrl = data.product.image_front_url || data.product.image_url || '';
          if (nome) {
            el(prefix + 'descricao').value = nome;
            if (imgUrl) {
              exibirImagemProduto(prefix, imgUrl);
            } else {
              // Se a API encontrou o nome mas não a foto, faz a busca genérica pelo nome do produto
              buscarImagemGenerica(prefix, nome);
            }
            statusEl.innerHTML = '<span class="ok">Localizado com sucesso!</span>';
            return;
          }
        }

        statusEl.innerHTML = '<span class="warn">Não encontrado. Digite a descrição.</span>';
        el(prefix + 'descricao').focus();

      } catch (e) {
        statusEl.innerHTML = '<span class="warn">Não encontrado. Digite manualmente.</span>';
        el(prefix + 'descricao').focus();
      }
    }

    // Função de fallback para buscar foto na Wikipedia/Wikimedia quando não houver foto no Open Food Facts
    async function buscarImagemGenerica(prefix, termo) {
      try {
        const query = encodeURIComponent(termo);
        const response = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${query}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`);
        const data = await response.json();
        if (data && data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          if (pages.length > 0 && pages[0].imageinfo && pages[0].imageinfo[0]) {
            exibirImagemProduto(prefix, pages[0].imageinfo[0].url);
          }
        }
      } catch(e) {
        console.error("Erro ao buscar imagem genérica:", e);
      }
    }
  </script>
</body>
</html>
