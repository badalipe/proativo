<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rede Market - Gestão de Trocas e Validades</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- XLSX Library para Exportação -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="p-4 md:p-8">

  <!-- CABEÇALHO -->
  <header class="card p-4 mb-6 flex flex-wrap justify-between items-center gap-4 bg-slate-900 text-white">
    <div class="flex items-center gap-3">
      <div class="bg-blue-600 p-3 rounded-lg font-bold text-xl">R</div>
      <div>
        <h1 class="text-xl font-bold">Rede Market</h1>
        <p class="text-xs text-slate-400">Gestão de Trocas e Prevenção de Perdas</p>
      </div>
    </div>

    <!-- SELETOR DE LOJAS -->
    <div class="flex items-center gap-2">
      <label for="selectLoja" class="text-sm font-medium"><i class="fa-solid fa-store mr-1"></i> Loja:</label>
      <select id="selectLoja" class="bg-slate-800 text-white border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <optgroup label="Angra dos Reis">
          <option value="Lapa">Lapa</option>
          <option value="Cais">Cais</option>
          <option value="Texaco">Texaco</option>
          <option value="Balneário">Balneário</option>
          <option value="Enseada">Enseada</option>
          <option value="Japuíba">Japuíba</option>
          <option value="Nova Angra">Nova Angra</option>
          <option value="Ribeira">Ribeira</option>
          <option value="Frade">Frade</option>
          <option value="Parque Mambucaba">Parque Mambucaba</option>
        </optgroup>
        <optgroup label="Paraty">
          <option value="Bananal" selected>Bananal</option>
          <option value="Patitiba">Patitiba</option>
        </optgroup>
      </select>
    </div>
  </header>

  <!-- ABAS DE NAVEGAÇÃO -->
  <div class="flex gap-2 mb-6">
    <button id="tabProativo" onclick="mudarAba('proativo')" class="flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow">
      <i class="fa-solid fa-barcode mr-2"></i> Módulo Pró-Ativo
    </button>
    <button id="tabTrocas" onclick="mudarAba('trocas')" class="flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-white text-slate-700 hover:bg-slate-100 shadow">
      <i class="fa-solid fa-arrows-rotate mr-2"></i> Módulo Trocas
    </button>
  </div>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-4xl mx-auto space-y-6">

    <!-- FORMULÁRIO PRÓ-ATIVO -->
    <div id="secProativo" class="card p-6 space-y-4">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-800">1. Escanear / Registrar Produto (Pró-Ativo)</h2>
      
      <div class="flex gap-2">
        <input type="text" id="pro_codigo" placeholder="Código de barras (EAN)" class="flex-1 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="buscarProduto('proativo')" class="bg-blue-600 text-white px-5 rounded-lg font-medium hover:bg-blue-700"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
      </div>

      <div id="pro_status" class="text-sm font-medium"></div>

      <!-- PREVIU DA IMAGEM SE HOUVER -->
      <div id="pro_container_img" class="hidden flex justify-center py-2">
        <img id="pro_img_preview" class="h-32 object-contain rounded border p-1" src="" alt="Foto do Produto">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição do produto</label>
          <input type="text" id="pro_descricao" placeholder="Descrição do produto" class="w-full border p-3 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Quantidade *</label>
          <input type="number" id="pro_qtd" placeholder="Ex.: 5" class="w-full border p-3 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Unidade</label>
          <input type="text" id="pro_unidade" value="und" class="w-full border p-3 rounded-lg outline-none bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Data de Validade *</label>
          <input type="date" id="pro_validade" class="w-full border p-3 rounded-lg outline-none">
        </div>
      </div>

      <button onclick="adicionarItem('proativo')" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">
        <i class="fa-solid fa-plus mr-2"></i> Adicionar Registro
      </button>
    </div>

    <!-- FORMULÁRIO TROCAS -->
    <div id="secTrocas" class="card p-6 space-y-4 hidden">
      <h2 class="text-lg font-bold border-b pb-2 text-slate-800">1. Escanear / Registrar Produto (Trocas)</h2>
      
      <div class="flex gap-2">
        <input type="text" id="trc_codigo" placeholder="Código de barras (EAN)" class="flex-1 border p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        <button onclick="buscarProduto('trocas')" class="bg-blue-600 text-white px-5 rounded-lg font-medium hover:bg-blue-700"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
      </div>

      <div id="trc_status" class="text-sm font-medium"></div>

      <!-- PREVIU DA IMAGEM SE HOUVER -->
      <div id="trc_container_img" class="hidden flex justify-center py-2">
        <img id="trc_img_preview" class="h-32 object-contain rounded border p-1" src="" alt="Foto do Produto">
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Descrição do produto</label>
          <input type="text" id="trc_descricao" placeholder="Descrição do produto" class="w-full border p-3 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Quantidade a trocar *</label>
          <input type="number" id="trc_qtd" placeholder="Ex.: 5" class="w-full border p-3 rounded-lg outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Unidade</label>
          <input type="text" id="trc_unidade" value="und" class="w-full border p-3 rounded-lg outline-none bg-slate-50">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Data de Validade *</label>
          <input type="date" id="trc_validade" class="w-full border p-3 rounded-lg outline-none">
        </div>
      </div>

      <button onclick="adicionarItem('trocas')" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-bold hover:bg-emerald-700 transition">
        <i class="fa-solid fa-plus mr-2"></i> Adicionar à Lista de Troca
      </button>
    </div>

    <!-- RELATÓRIO E LISTA DE ITENS REGISTRADOS -->
    <div class="card p-6 space-y-4">
      <div class="flex flex-wrap justify-between items-center gap-2 border-b pb-3">
        <h3 class="font-bold text-slate-800 text-lg">Itens Adicionados (<span id="countItens">0</span>)</h3>
        <button onclick="exportarExcel()" class="bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-800 transition">
          <i class="fa-solid fa-file-excel mr-2"></i> Exportar Excel
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left text-slate-600">
          <thead class="text-xs text-slate-700 uppercase bg-slate-100">
            <tr>
              <th class="p-3">Loja</th>
              <th class="p-3">Módulo</th>
              <th class="p-3">Código</th>
              <th class="p-3">Descrição</th>
              <th class="p-3">Qtd</th>
              <th class="p-3">Validade</th>
              <th class="p-3 text-center">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaItens">
            <tr>
              <td colspan="7" class="text-center p-4 text-slate-400">Nenhum item adicionado até o momento.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT PRINCIPAL -->
  <script>
    // Armazenamento dos lançamentos na memória local
    let listaItens = [];

    // Produtos pré-cadastrados (Fallback)
    const produtosPreCadastrados = {
      "7896089011357": { nome: "Café Pilão Tradicional A Vácuo 500g", img: "https://images.weserv.nl/?url=m.media-amazon.com/images/I/71wZqXyG2BL._AC_SL1500_.jpg&w=500&h=500&fit=cover" },
      "7898279710590": { nome: "Produto Localizado Via EAN", img: "" },
      "7896045112098": { nome: "Refresco em Pó Frisco Abacaxi 18g", img: "" },
      "7896183210120": { nome: "Leite Glória", img: "" }
    };

    let catalogoLocal = JSON.parse(localStorage.getItem('catalogoLocal') || '{}');

    function el(id) { return document.getElementById(id); }

    function mudarAba(aba) {
      if(aba === 'proativo') {
        el('secProativo').classList.remove('hidden');
        el('secTrocas').classList.add('hidden');
        el('tabProativo').className = 'flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow';
        el('tabTrocas').className = 'flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-white text-slate-700 hover:bg-slate-100 shadow';
      } else {
        el('secTrocas').classList.remove('hidden');
        el('secProativo').classList.add('hidden');
        el('tabTrocas').className = 'flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-blue-600 text-white shadow';
        el('tabProativo').className = 'flex-1 py-3 px-4 rounded-lg font-semibold text-center transition bg-white text-slate-700 hover:bg-slate-100 shadow';
      }
    }

    function exibirImagemProduto(prefix, url) {
      if (!url) return;
      el(prefix + 'img_preview').src = url;
      el(prefix + 'container_img').classList.remove('hidden');
    }

    function ocultarImagemProduto(prefix) {
      el(prefix + 'container_img').classList.add('hidden');
      el(prefix + 'img_preview').src = '';
    }

    async function buscarProduto(modulo) {
      const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
      const code = el(prefix + 'codigo').value.trim().replace(/\D/g, '');
      const statusEl = el(prefix + 'status');
      
      ocultarImagemProduto(prefix);

      if (!code) {
        statusEl.innerHTML = '<span class="text-amber-600">Informe um código.</span>';
        return;
      }
      
      statusEl.innerHTML = '<span class="text-blue-600">⚡ Buscando...</span>';
      
      // 1. Verificação no catálogo local do usuário
      if (catalogoLocal[code]) {
        const p = typeof catalogoLocal[code] === 'object' ? catalogoLocal[code] : { nome: catalogoLocal[code], img: '' };
        el(prefix + 'descricao').value = p.nome;
        if (p.img) exibirImagemProduto(prefix, p.img);
        statusEl.innerHTML = '<span class="text-emerald-600 font-bold">Localizado no catálogo local!</span>';
        return;
      }
      
      // 2. Verificação nos pré-cadastrados do sistema
      if (produtosPreCadastrados[code]) {
        const p = produtosPreCadastrados[code];
        el(prefix + 'descricao').value = p.nome;
        if (p.img) {
          exibirImagemProduto(prefix, p.img);
        } else {
          buscarImagemGenerica(prefix, p.nome);
        }
        statusEl.innerHTML = '<span class="text-emerald-600 font-bold">Localizado no sistema!</span>';
        return;
      }
      
      // 3. Busca no Open Food Facts
      try {
        let res = await fetch(`https://br.openfoodfacts.org/api/v0/product/${code}.json`);
        let data = await res.json();
        
        if (data && data.status === 1 && data.product) {
          const nome = data.product.product_name_pt || data.product.product_name || data.product.generic_name || '';
          const imgUrl = data.product.image_front_url || data.product.image_url || '';
          if (nome) {
            el(prefix + 'descricao').value = nome;
            if (imgUrl) {
              exibirImagemProduto(prefix, imgUrl);
            } else {
              buscarImagemGenerica(prefix, nome);
            }
            statusEl.innerHTML = '<span class="text-emerald-600 font-bold">Localizado com sucesso!</span>';
            return;
          }
        }

        statusEl.innerHTML = '<span class="text-amber-600">Não encontrado. Digite a descrição.</span>';
        el(prefix + 'descricao').focus();

      } catch (e) {
        statusEl.innerHTML = '<span class="text-amber-600">Não encontrado. Digite a descrição.</span>';
        el(prefix + 'descricao').focus();
      }
    }

    async function buscarImagemGenerica(prefix, termo) {
      try {
        const query = encodeURIComponent(termo + ' produto');
        const response = await fetch(`https://commons.wikimedia.org/w/api.php?action=query&generator=search&gteissearch=${query}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&format=json&origin=*`);
        const data = await response.json();
        if (data && data.query && data.query.pages) {
          const pages = Object.values(data.query.pages);
          if (pages.length > 0 && pages[0].imageinfo && pages[0].imageinfo[0]) {
            exibirImagemProduto(prefix, pages[0].imageinfo[0].url);
          }
        }
      } catch(e) {}
    }

    function adicionarItem(modulo) {
      const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
      const lojaAtual = el('selectLoja').value;
      const codigo = el(prefix + 'codigo').value.trim();
      const descricao = el(prefix + 'descricao').value.trim();
      const qtd = el(prefix + 'qtd').value.trim();
      const unidade = el(prefix + 'unidade').value.trim();
      const validade = el(prefix + 'validade').value;

      if (!descricao || !qtd || !validade) {
        alert('Por favor, preencha todos os campos obrigatórios (Descrição, Quantidade e Validade).');
        return;
      }

      const item = {
        loja: lojaAtual,
        modulo: modulo === 'proativo' ? 'Pró-Ativo' : 'Trocas',
        codigo: codigo || 'N/A',
        descricao: descricao,
        qtd: qtd,
        unidade: unidade,
        validade: validade
      };

      listaItens.push(item);
      
      // Atualizar catálogo local com novos cadastros
      if (codigo && codigo !== 'N/A') {
        catalogoLocal[codigo] = { nome: descricao, img: el(prefix + 'img_preview').src || '' };
        localStorage.setItem('catalogoLocal', JSON.stringify(catalogoLocal));
      }

      // Limpar campos
      el(prefix + 'codigo').value = '';
      el(prefix + 'descricao').value = '';
      el(prefix + 'qtd').value = '';
      el(prefix + 'validade').value = '';
      el(prefix + 'status').innerHTML = '';
      ocultarImagemProduto(prefix);

      atualizarTabela();
    }

    function removerItem(index) {
      listaItens.splice(index, 1);
      atualizarTabela();
    }

    function atualizarTabela() {
      const tbody = el('tabelaItens');
      el('countItens').innerText = listaItens.length;

      if (listaItens.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center p-4 text-slate-400">Nenhum item adicionado até o momento.</td></tr>`;
        return;
      }

      tbody.innerHTML = listaItens.map((item, i) => `
        <tr class="border-b hover:bg-slate-50">
          <td class="p-3 font-semibold text-slate-700">${item.loja}</td>
          <td class="p-3">${item.modulo}</td>
          <td class="p-3">${item.codigo}</td>
          <td class="p-3 font-medium">${item.descricao}</td>
          <td class="p-3">${item.qtd} ${item.unidade}</td>
          <td class="p-3">${item.validade.split('-').reverse().join('/')}</td>
          <td class="p-3 text-center">
            <button onclick="removerItem(${i})" class="text-red-500 hover:text-red-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function exportarExcel() {
      if (listaItens.length === 0) {
        alert('A lista está vazia! Adicione itens antes de exportar.');
        return;
      }

      // Mapeamento dos dados garantindo a presença do nome da Loja dinâmico
      const dadosExportacao = listaItens.map(i => ({
        "Loja": i.loja,
        "Módulo": i.modulo,
        "Código de Barras": i.codigo,
        "Descrição do Produto": i.descricao,
        "Quantidade": i.qtd,
        "Unidade": i.unidade,
        "Data de Validade": i.validade.split('-').reverse().join('/')
      }));

      const worksheet = XLSX.utils.json_to_sheet(dadosExportacao);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Relatorio_Trocas");

      const lojaNome = el('selectLoja').value;
      const dataHoje = new Date().toISOString().slice(0,10);
      XLSX.writeFile(workbook, `Relatorio_${lojaNome}_${dataHoje}.xlsx`);
    }
  </script>
</body>
</html>
