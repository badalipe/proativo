<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Planilha - Pró Ativo Frios</title>
  <!-- Biblioteca xlsx-populate via CDN -->
  <script src="https://unpkg.com/xlsx-populate/browser/xlsx-populate.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 120px; font-weight: bold; }
    input, select { padding: 5px; width: 200px; }
    button { padding: 8px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; margin-right: 10px; }
    button:hover { background-color: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
  </style>
</head>
<body>

  <h2>Lançamento - Pró Ativo Frios</h2>

  <div class="form-group">
    <label for="pro_comprador">Comprador:</label>
    <input type="text" id="pro_comprador" placeholder="Nome do Comprador">
  </div>
  <div class="form-group">
    <label for="pro_digitou">Quem Digitou:</label>
    <input type="text" id="pro_digitou" placeholder="Nome do Digitador">
  </div>

  <hr>

  <h3>Adicionar Item</h3>
  <div class="form-group">
    <label for="codigo">Código:</label>
    <input type="text" id="codigo">
    <label for="descricao">Descrição:</label>
    <input type="text" id="descricao">
  </div>
  <div class="form-group">
    <label for="quantidade">Qtd Estoque:</label>
    <input type="number" id="quantidade">
    <label for="unidade">Unidade/Caixa:</label>
    <input type="text" id="unidade" placeholder="CX, UND, UN">
  </div>
  <div class="form-group">
    <label for="validade">Data Validade:</label>
    <input type="date" id="validade">
    <label for="valor">Valor Unitário:</label>
    <input type="number" step="0.01" id="valor">
  </div>

  <button onclick="adicionarItem()">Adicionar À Lista</button>
  <button onclick="gerarExcel('proativo')">Gerar Excel</button>

  <h3>Itens Adicionados</h3>
  <table>
    <thead>
      <tr>
        <th>Cód</th>
        <th>Descrição</th>
        <th>Qtd</th>
        <th>Unidade</th>
        <th>Validade</th>
        <th>Valor Unit.</th>
      </tr>
    </thead>
    <tbody id="tabela_itens"></tbody>
  </table>

  <script>
    const itensProAtivo = [];
    const itensTrocas = [];

    function el(id) {
      return document.getElementById(id);
    }

    function adicionarItem() {
      const item = {
        codigo: el('codigo').value,
        descricao: el('descricao').value,
        quantidade: el('quantidade').value,
        unidade: el('unidade').value,
        validade: el('validade').value,
        valor: el('valor').value
      };

      if (!item.codigo || !item.descricao) {
        alert("Preencha ao menos o Código e a Descrição.");
        return;
      }

      itensProAtivo.push(item);
      atualizarTabela();

      // Limpa os campos de item
      el('codigo').value = '';
      el('descricao').value = '';
      el('quantidade').value = '';
      el('unidade').value = '';
      el('validade').value = '';
      el('valor').value = '';
    }

    function atualizarTabela() {
      const tbody = el('tabela_itens');
      tbody.innerHTML = '';
      itensProAtivo.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.codigo}</td>
          <td>${item.descricao}</td>
          <td>${item.quantidade}</td>
          <td>${item.unidade}</td>
          <td>${item.validade}</td>
          <td>R$ ${parseFloat(item.valor || 0).toFixed(2)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function gerarExcel(modulo) {
      const listaData = modulo === 'proativo' ? itensProAtivo : itensTrocas;
      if (listaData.length === 0) {
        alert("Adicione itens antes de gerar a planilha.");
        return;
      }

      try {
        const urlModelo = './planilha_padrao_original.xlsx';
        const response = await fetch(urlModelo);
        
        if (!response.ok) {
          throw new Error("Arquivo modelo 'planilha_padrao_original.xlsx' não foi encontrado na raiz do projeto.");
        }

        const arrayBuffer = await response.arrayBuffer();
        const workbook = await XlsxPopulate.fromDataAsync(arrayBuffer);
        const sheet = workbook.sheet(0);

        const prefix = modulo === 'proativo' ? 'pro_' : 'trc_';
        
        const loja = "PATITIBA";
        const digitou = el(prefix + 'digitou') ? el(prefix + 'digitou').value : "";
        const comprador = el(prefix + 'comprador') ? el(prefix + 'comprador').value : "";

        // Preenchimento do cabeçalho topo
        try { sheet.cell("H1").value(loja); } catch(e){}
        try { sheet.cell("H2").value(digitou); } catch(e){}

        const LINHA_INICIAL = 7;

        listaData.forEach((item, index) => {
          const row = LINHA_INICIAL + index;
          const dataFmt = item.validade ? item.validade.split('-').reverse().join('/') : '';

          // Inserção por índice de coluna (2 = B, 3 = C, etc.)
          sheet.row(row).cell(2).value(comprador);              // Coluna B: Comprador
          sheet.row(row).cell(3).value(loja);                   // Coluna C: Loja
          sheet.row(row).cell(4).value(String(item.codigo));    // Coluna D: Código do Produto
          sheet.row(row).cell(5).value(String(item.descricao)); // Coluna E: Descrição do produto
          sheet.row(row).cell(6).value(Number(item.quantidade));// Coluna F: Quantidade no Estoque
          sheet.row(row).cell(7).value(String(item.unidade));   // Coluna G: Unidade / Caixa / Fardo
          sheet.row(row).cell(8).value(dataFmt);                // Coluna H: Data de Validade
          sheet.row(row).cell(9).value(Number(item.valor));      // Coluna I: Valor Unitário
        });

        const blob = await workbook.outputAsync();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Pro_Ativo_Frios_${new Date().toISOString().split('T')[0]}.xlsx`;
        a.click();
        window.URL.revokeObjectURL(url);

      } catch (e) {
        alert("Erro ao exportar Excel: " + e.message);
      }
    }
  </script>
</body>
</html>
