<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Coletor de Dados - Rede Market</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 margin: 20px;
 background-color: #f4f4f9;
 }
 .container {
 max-width: 600px;
 margin: 0 auto;
 background: #fff;
 padding: 20px;
 border-radius: 8px;
 box-shadow: 0 2px 5px rgba(0,0,0,0.1);
 }
 h2 {
 text-align: center;
 color: #333;
 }
 .form-group {
 margin-bottom: 15px;
 }
 label {
 display: block;
 margin-bottom: 5px;
 font-weight: bold;
 }
 input, select {
 width: 100%;
 padding: 10px;
 box-sizing: border-box;
 border: 1px solid #ccc;
 border-radius: 4px;
 }
 button {
 width: 100%;
 padding: 12px;
 background-color: #007bff;
 color: white;
 border: none;
 border-radius: 4px;
 font-size: 16px;
 cursor: pointer;
 }
 button:hover {
 background-color: #0056b3;
 }
 .table-preview {
 margin-top: 20px;
 width: 100%;
 border-collapse: collapse;
 }
 .table-preview th, .table-preview td {
 border: 1px solid #ddd;
 padding: 8px;
 text-align: left;
 }
 .table-preview th {
 background-color: #f2f2f2;
 }
 </style>
 <!-- Biblioteca para exportar diretamente para Excel (XLSX) -->
 <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="container">
 <h2>Lançamento de Estoque</h2>
  
<form id="stockForm">
 <div class="form-group">
 <label for="loja">Loja</label>
 <input type="text" id="loja" value="Patitiba" required>
 </div>
 
 <div class="form-group">
 <label for="codigo">Código do Produto</label>
 <input type="text" id="codigo" placeholder="7896336006778" required>
 </div>
 
 <div class="form-group">
 <label for="descricao">Descrição do Produto</label>
 <input type="text" id="descricao" placeholder="Nome do produto" required>
 </div>
 
 <div class="form-group">
 <label for="qtd">Quantidade no Estoque</label>
 <input type="number" id="qtd" step="any" required>
 </div>
 
 <div class="form-group">
 <label for="unidade">Unidade / Caixa / Fardo</label>
 <select id="unidade">
 <option value="und">und</option>
 <option value="cx">cx</option>
 <option value="fd">fd</option>
 <option value="kg">kg</option>
 </select>
 </div>
 
 <div class="form-group">
 <label for="validade">Data de Validade</label>
 <input type="text" id="validade" placeholder="DD/MM/AAAA">
 </div>
 
 <div class="form-group">
 <label for="valor">Valor Unitário (R$)</label>
 <input type="number" id="valor" step="0.01" value="0.00">
 </div>
 
 <button type="button" onclick="adicionarItem()">Adicionar à Lista</button>
 </form>
 
 <br>
 <button type="button" onclick="exportarExcel()" style="background-color: #28a745;">Exportar para Excel (.xlsx)</button>
 
 <h3>Itens Digitados</h3>
 <table class="table-preview" id="itensTable">
 <thead>
 <tr>
 <th>Item</th>
 <th>Loja</th>
 <th>Código</th>
 <th>Descrição</th>
 <th>Qtd</th>
 <th>Emb.</th>
 <th>Validade</th>
 <th>Valor</th>
 </tr>
 </thead>
 <tbody>
 <!-- Os itens serão inseridos aqui -->
 </tbody>
 </table>
</div>

<script>
 const itens = [];

 function adicionarItem() {
 const lojaInput = document.getElementById('loja').value.trim();
 const loja = lojaInput !== "" ? lojaInput : "Patitiba"; // Garante Patitiba se alterado ou vazio
 const codigo = document.getElementById('codigo').value;
 const descricao = document.getElementById('descricao').value;
 const qtd = document.getElementById('qtd').value;
 const unidade = document.getElementById('unidade').value;
 const validade = document.getElementById('validade').value;
 const valor = parseFloat(document.getElementById('valor').value || 0).toFixed(2);
 
 if (!codigo || !descricao || !qtd) {
 alert('Preencha os campos obrigatórios!');
 return;
 }
 
 const itemObj = {
 itemNum: itens.length + 1,
 comprador: '', // Mantido em branco na Coluna B
 loja: loja,          // Na Coluna C (Patitiba)
 codigo: codigo,      // Na Coluna D (Código do Produto)
 descricao: descricao,// Na Coluna E (Descrição)
 qtd: Number(qtd),    // Na Coluna F (Qtd)
 unidade: unidade,    // Na Coluna G (Unidade)
 validade: validade,  // Na Coluna H (Validade/Data)
 valor: Number(valor) // Na Coluna I (Valor)
 };
 
 itens.push(itemObj);
 atualizarTabela();
 limparCampos();
 }

 function atualizarTabela() {
 const tbody = document.querySelector('#itensTable tbody');
 tbody.innerHTML = '';
 
 itens.forEach(item => {
 const tr = document.createElement('tr');
 tr.innerHTML = `
 <td>${item.itemNum}</td>
 <td>${item.loja}</td>
 <td>${item.codigo}</td>
 <td>${item.descricao}</td>
 <td>${item.qtd}</td>
 <td>${item.unidade}</td>
 <td>${item.validade}</td>
 <td>R$ ${item.valor.toFixed(2)}</td>
 `;
 tbody.appendChild(tr);
 });
 }

 function limparCampos() {
 document.getElementById('codigo').value = '';
 document.getElementById('descricao').value = '';
 document.getElementById('qtd').value = '';
 document.getElementById('validade').value = '';
 document.getElementById('codigo').focus();
 }

 function exportarExcel() {
 if (itens.length === 0) {
 alert('Nenhum item para exportar!');
 return;
 }
 
 const ws_data = [];
 
 // Estrutura exata do cabeçalho original nas primeiras linhas
 ws_data[0] = []; 
 ws_data[1] = ['', '', '', '', '', '', '666', 'und', '0']; 
 ws_data[2] = ['', '', '', '', '', '', 'Gerente / Avaliação', ''];
 ws_data[3] = ['', '', '', '', '', '', 'Data', new Date().toLocaleDateString('pt-BR')];
 ws_data[4] = ['', '', '', '', '', '', 'Quem Digitou?', ''];
  
 // Linha 6 (índice 5): Cabeçalhos da tabela principal
 ws_data[5] = [
 '', 
 'Comprador', 
 'Loja', 
 'Código do Produto', 
 'Descrição do produto', 
 'Quantidade no Estoque', 
 'Unidade / Caixa / Fardo', 
 'Data de Validade', 
 'Valor Unitário'
 ];
 
 // Inserção correta dos dados a partir da linha 7 em diante (índice 6+)
 itens.forEach((item, index) => {
 ws_data[6 + index] = [
 item.itemNum,       // Coluna A (0): Número do item
 item.comprador,     // Coluna B (1): Em branco
 item.loja,          // Coluna C (2): Patitiba
 item.codigo,        // Coluna D (3): Código do Produto
 item.descricao,     // Coluna E (4): Descrição do Produto
 item.qtd,           // Coluna F (5): Quantidade
 item.unidade,       // Coluna G (6): Unidade
 item.validade,      // Coluna H (7): Validade
 item.valor          // Coluna I (8): Valor Unitário
 ];
 });
 
 const ws = XLSX.utils.aoa_to_sheet(ws_data);
 const wb = XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb, ws, "Pró Ativo Frios");
 
 XLSX.writeFile(wb, "Pro_Ativo_Patitiba.xlsx");
 }
</script>
</body>
</html>
