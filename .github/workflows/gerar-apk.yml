name: Gerar APK do RM Gestor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar Android SDK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app-src/app/src/main/java/com/bdtecnologia/proativo
          mkdir -p app-src/app/src/main/res/drawable
          cp icon-512x512.png app-src/app/src/main/res/drawable/ic_launcher.png
          cp suporte.png app-src/app/src/main/res/drawable/suporte.png

          cat > app-src/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProAtivo"
          include ':app'
          EOF

          cat > app-src/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app-src/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app-src/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bdtecnologia.proativo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.bdtecnologia.proativo"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
          }
          EOF

          cat > app-src/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:label="RM Gestor"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.mlkit.vision.codescanner.API_ENABLED"
                      android:value="true" />
              </application>
          </manifest>
          EOF

          cat > app-src/app/src/main/java/com/bdtecnologia/proativo/MainActivity.java <<'EOF'
          package com.bdtecnologia.proativo;

          import android.Manifest;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.JsResult;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageButton;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;

          import com.bdtecnologia.proativo.R;
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanner;
          import com.google.mlkit.vision.codescanner.GmsBarcodeScanning;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView web;
              private Button btnMenuFlutuante;
              private Button btnCamera;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);

                  btnMenuFlutuante = new Button(this);
                  btnMenuFlutuante.setText("\u2190 Menu");
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  int margem = dp(12);
                  lp.setMargins(margem, dp(44), margem, margem);
                  btnMenuFlutuante.setLayoutParams(lp);
                  btnMenuFlutuante.setAlpha(0.92f);
                  btnMenuFlutuante.setTextColor(0xFFFFFFFF);
                  btnMenuFlutuante.setBackgroundColor(0xCC333333);
                  btnMenuFlutuante.setVisibility(View.GONE);
                  final float[] desl = new float[2];
                  final boolean[] moveu = new boolean[1];
                  btnMenuFlutuante.setOnTouchListener((v, ev) -> {
                      switch (ev.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              desl[0] = v.getX() - ev.getRawX();
                              desl[1] = v.getY() - ev.getRawY();
                              moveu[0] = false;
                              return false;
                          case MotionEvent.ACTION_MOVE:
                              float nx = ev.getRawX() + desl[0];
                              float ny = ev.getRawY() + desl[1];
                              if (!moveu[0] && (Math.abs(nx - v.getX()) > 12 || Math.abs(ny - v.getY()) > 12)) moveu[0] = true;
                              if (moveu[0]) {
                                  v.setX(nx);
                                  v.setY(ny);
                                  return true;
                              }
                              return false;
                          default:
                              return false;
                      }
                  });
                  btnMenuFlutuante.setOnClickListener(v -> {
                      if (web.canGoBack()) {
                          web.goBack();
                      } else {
                          web.loadUrl("https://badalipe.github.io/proativo/");
                      }
                  });

                  btnCamera = new Button(this);
                  btnCamera.setText("\uD83D\uDCF7");
                  FrameLayout.LayoutParams lpCam = new FrameLayout.LayoutParams(dp(62), dp(62));
                  lpCam.gravity = Gravity.BOTTOM | Gravity.END;
                  lpCam.setMargins(dp(20), dp(20), dp(20), dp(20));
                  btnCamera.setLayoutParams(lpCam);
                  btnCamera.setTextSize(26);
                  btnCamera.setTextColor(0xFFFFFFFF);
                  android.graphics.drawable.GradientDrawable fundoCam = new android.graphics.drawable.GradientDrawable(
                          android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF0091EA, 0xFF003E7E});
                  fundoCam.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  fundoCam.setStroke(dp(2), 0xB3FFFFFF);
                  btnCamera.setBackground(fundoCam);
                  if (Build.VERSION.SDK_INT >= 21) btnCamera.setElevation(dp(8));
                  btnCamera.setVisibility(View.GONE);
                  final float[] deslCam = new float[2];
                  final boolean[] moveuCam = new boolean[1];
                  btnCamera.setOnTouchListener((v, ev) -> {
                      switch (ev.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              deslCam[0] = v.getX() - ev.getRawX();
                              deslCam[1] = v.getY() - ev.getRawY();
                              moveuCam[0] = false;
                              return false;
                          case MotionEvent.ACTION_MOVE:
                              float cx = ev.getRawX() + deslCam[0];
                              float cy = ev.getRawY() + deslCam[1];
                              if (!moveuCam[0] && (Math.abs(cx - v.getX()) > 12 || Math.abs(cy - v.getY()) > 12)) moveuCam[0] = true;
                              if (moveuCam[0]) {
                                  v.setX(cx);
                                  v.setY(cy);
                                  return true;
                              }
                              return false;
                          default:
                              return false;
                      }
                  });
                  btnCamera.setOnClickListener(v -> abrirScannerNativo());

                  ImageButton btnSuporte = new ImageButton(this);
                  btnSuporte.setImageResource(R.drawable.suporte);
                  FrameLayout.LayoutParams lpSup = new FrameLayout.LayoutParams(dp(62), dp(62));
                  lpSup.gravity = Gravity.BOTTOM | Gravity.START;
                  lpSup.setMargins(dp(20), dp(20), dp(20), dp(20));
                  btnSuporte.setLayoutParams(lpSup);
                  android.graphics.drawable.GradientDrawable fundoSup = new android.graphics.drawable.GradientDrawable();
                  fundoSup.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  fundoSup.setColor(0xFFFFFFFF);
                  fundoSup.setStroke(dp(3), 0xFF25D366);
                  btnSuporte.setBackground(fundoSup);
                  btnSuporte.setPadding(dp(2), dp(2), dp(2), dp(2));
                  btnSuporte.setScaleType(ImageButton.ScaleType.CENTER_CROP);
                  if (Build.VERSION.SDK_INT >= 21) {
                      btnSuporte.setElevation(dp(8));
                      btnSuporte.setClipToOutline(true);
                  }
                  btnSuporte.setVisibility(View.GONE);
                  final float[] deslSup = new float[2];
                  final boolean[] moveuSup = new boolean[1];
                  btnSuporte.setOnTouchListener((v, ev) -> {
                      switch (ev.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              deslSup[0] = v.getX() - ev.getRawX();
                              deslSup[1] = v.getY() - ev.getRawY();
                              moveuSup[0] = false;
                              return false;
                          case MotionEvent.ACTION_MOVE:
                              float sx = ev.getRawX() + deslSup[0];
                              float sy = ev.getRawY() + deslSup[1];
                              if (!moveuSup[0] && (Math.abs(sx - v.getX()) > 12 || Math.abs(sy - v.getY()) > 12)) moveuSup[0] = true;
                              if (moveuSup[0]) {
                                  v.setX(sx);
                                  v.setY(sy);
                                  return true;
                              }
                              return false;
                          default:
                              return false;
                      }
                  });
                  btnSuporte.setOnClickListener(v -> {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/5521990706088?text=Ola!%20Preciso%20de%20suporte%20com%20o%20app%20Pro-Ativo%20da%20Rede%20Market."));
                          startActivity(intent);
                      } catch (Exception ex) {
                          Toast.makeText(this, "Nao foi possivel abrir o WhatsApp.", Toast.LENGTH_LONG).show();
                      }
                  });

                  FrameLayout root = new FrameLayout(this);
                  root.addView(web);
                  root.addView(btnMenuFlutuante);
                  root.addView(btnCamera);
                  root.addView(btnSuporte);
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  web.addJavascriptInterface(new AndroidBridge(this), "Android");

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }

                      @Override
                      public boolean onJsAlert(WebView view, String url, String message, final JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext())
                                  .setTitle("Rede Market")
                                  .setMessage(message)
                                  .setPositiveButton("OK", (dialog, which) -> result.confirm())
                                  .setOnCancelListener(dialog -> result.cancel())
                                  .show();
                          return true;
                      }

                      @Override
                      public boolean onJsConfirm(WebView view, String url, String message, final JsResult result) {
                          new android.app.AlertDialog.Builder(view.getContext())
                                  .setTitle("Rede Market")
                                  .setMessage(message)
                                  .setPositiveButton("Sim", (dialog, which) -> result.confirm())
                                  .setNegativeButton("Nao", (dialog, which) -> result.cancel())
                                  .setOnCancelListener(dialog -> result.cancel())
                                  .show();
                          return true;
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          boolean noApp = (url != null && url.contains("badalipe.github.io"));
                          btnMenuFlutuante.setVisibility(noApp ? View.GONE : View.VISIBLE);
                          btnCamera.setVisibility(View.VISIBLE);
                          btnSuporte.setVisibility(View.VISIBLE);
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      if (url.startsWith("blob:")) {
                          String js = "(async()=>{try{const r=await fetch('" + url + "');"
                                  + "const b=await r.blob();const fr=new FileReader();"
                                  + "fr.onload=()=>Android.salvarBase64(fr.result.split(',')[1],'" + mimetype + "');"
                                  + "fr.readAsDataURL(b);}catch(e){}})()";
                          web.evaluateJavascript(js, null);
                      } else if (url.startsWith("data:")) {
                          String base64 = url.substring(url.indexOf(",") + 1);
                          new AndroidBridge(MainActivity.this).salvarBase64(base64, mimetype);
                      } else {
                          try {
                              DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                              req.setMimeType(mimetype);
                              req.addRequestHeader("User-Agent", userAgent);
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              String nome = URLUtil.guessFileName(url, contentDisposition, mimetype);
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, nome);
                              ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                              Toast.makeText(MainActivity.this, "Baixando " + nome, Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Nao foi possivel baixar.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 101);
                  }

                  web.loadUrl("https://badalipe.github.io/proativo/");
              }

              private void abrirScannerNativo() {
                  try {
                      GmsBarcodeScanner scanner = GmsBarcodeScanning.getClient(this);
                      scanner.startScan()
                              .addOnSuccessListener(resultado -> {
                                  String codigo = resultado.getRawValue();
                                  if (codigo != null && !codigo.isEmpty()) {
                                      processarCodigo(codigo);
                                  }
                              })
                              .addOnCanceledListener(() -> { })
                              .addOnFailureListener(e -> Toast.makeText(this, "Scanner indisponivel neste aparelho.", Toast.LENGTH_LONG).show());
                  } catch (Exception e) {
                      Toast.makeText(this, "Scanner indisponivel neste aparelho.", Toast.LENGTH_LONG).show();
                  }
              }

              private void processarCodigo(String codigo) {
                  String seguro = codigo.replace("'", "").replace("\\", "");
                  String js = "(function(c){try{"
                          + "function visivel(e){if(!e)return false;var r=e.getBoundingClientRect();var st=getComputedStyle(e);return r.width>0&&r.height>0&&st.visibility!=='hidden'&&st.display!=='none';}"
                          + "function texto(e){return e&&e.tagName==='INPUT'&&(e.type==='text'||e.type==='search'||e.type==='number'||e.type==='');}"
                          + "function preencher(e){e.focus();e.value=c;['input','change'].forEach(function(t){e.dispatchEvent(new Event(t,{bubbles:true}));});[13].forEach(function(k){e.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',code:'Enter',keyCode:k,which:k,bubbles:true}));e.dispatchEvent(new KeyboardEvent('keypress',{key:'Enter',code:'Enter',keyCode:k,which:k,bubbles:true}));e.dispatchEvent(new KeyboardEvent('keyup',{key:'Enter',code:'Enter',keyCode:k,which:k,bubbles:true}));});}"
                          + "function esconderTeclado(){try{if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}catch(x){}}"
                          + "var p=document.getElementById('proativo-modal');"
                          + "var t=document.getElementById('trocas-modal');"
                          + "if(p&&!p.classList.contains('hidden')){var i=document.getElementById('pro_codigo');if(i){preencher(i);buscarProduto('proativo');setTimeout(esconderTeclado,300);return;}}"
                          + "if(t&&!t.classList.contains('hidden')){var i2=document.getElementById('trc_codigo');if(i2){preencher(i2);buscarProduto('trocas');setTimeout(esconderTeclado,300);return;}}"
                          + "var inputs=Array.prototype.slice.call(document.querySelectorAll('input')).filter(function(e){return texto(e)&&visivel(e)&&!e.disabled&&!e.readOnly;});"
                          + "if(inputs.length===0)return;"
                          + "var alvo=null;"
                          + "for(var k=0;k<inputs.length;k++){var el=inputs[k];var node=el.parentElement;var prof=0;while(node&&prof<6){var cls=(node.className||'')+'';var role=node.getAttribute&&node.getAttribute('role');if(/modal|dialog|popup|overlay/i.test(cls)||role==='dialog'){if(visivel(node)){alvo=el;break;}}node=node.parentElement;prof++;}if(alvo)break;}"
                          + "if(!alvo)alvo=inputs[inputs.length-1];"
                          + "preencher(alvo);"
                          + "setTimeout(esconderTeclado,300);"
                          + "}catch(err){}})('" + seguro + "')";
                  web.evaluateJavascript(js, null);
              }

              private int dp(int valor) {
                  return (int) (valor * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              public void onBackPressed() {
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              public static class AndroidBridge {
                  private final android.app.Activity activity;
                  AndroidBridge(android.app.Activity a) { activity = a; }

                  @JavascriptInterface
                  public void salvarArquivo(String base64, String nome, String mime) {
                      try {
                          byte[] bytes = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
                          String limpo = (nome == null || nome.trim().isEmpty())
                                  ? ("Relatorio_" + System.currentTimeMillis() + ".xlsx")
                                  : nome.trim().replaceAll("[^a-zA-Z0-9._-]", "_");
                          if (!limpo.toLowerCase().endsWith(".xlsx") && !limpo.toLowerCase().endsWith(".pdf") && !limpo.toLowerCase().endsWith(".csv")) {
                              limpo = limpo + ".xlsx";
                          }
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, limpo);
                              values.put(MediaStore.Downloads.MIME_TYPE, mime);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = activity.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("uri nula");
                              OutputStream out = activity.getContentResolver().openOutputStream(uri);
                              out.write(bytes);
                              out.close();
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              File f = new File(dir, limpo);
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(bytes);
                              fos.close();
                          }
                          final String nomeFinal = limpo;
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Salvo em Downloads: " + nomeFinal, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Erro ao salvar: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }

                  @JavascriptInterface
                  public void salvarBase64(String base64, String mime) {
                      try {
                          byte[] bytes = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
                          String ext = ".xlsx";
                          if (mime != null && mime.contains("pdf")) ext = ".pdf";
                          if (mime != null && mime.contains("csv")) ext = ".csv";
                          String nome = "Relatorio_" + System.currentTimeMillis() + ext;

                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, nome);
                              values.put(MediaStore.Downloads.MIME_TYPE, mime);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = activity.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("uri nula");
                              OutputStream out = activity.getContentResolver().openOutputStream(uri);
                              out.write(bytes);
                              out.close();
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              File f = new File(dir, nome);
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(bytes);
                              fos.close();
                          }
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Salvo em Downloads: " + nome, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Erro ao salvar: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd app-src
          gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app-src/app/build/outputs/apk/debug/app-debug.apk RMGestor-v2.apk

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: RMGestor-APK
          path: RMGestor-v2.apk
