name: Gerar APK do Pro-Ativo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar Android SDK
        run: |
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app-src/app/src/main/java/com/bdtecnologia/proativo
          mkdir -p app-src/app/src/main/res/drawable
          cp icon-512x512.png app-src/app/src/main/res/drawable/ic_launcher.png

          cat > app-src/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProAtivo"
          include ':app'
          EOF

          cat > app-src/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app-src/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app-src/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bdtecnologia.proativo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.bdtecnologia.proativo"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'androidx.appcompat:appcompat:1.6.1'
              def camerax_version = '1.3.1'
              implementation "androidx.camera:camera-core:$camerax_version"
              implementation "androidx.camera:camera-camera2:$camerax_version"
              implementation "androidx.camera:camera-lifecycle:$camerax_version"
              implementation "androidx.camera:camera-view:$camerax_version"
              implementation 'com.google.mlkit:barcode-scanning:17.1.0'
          }
          EOF

          cat > app-src/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:label="Pro-Ativo"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app-src/app/src/main/java/com/bdtecnologia/proativo/MainActivity.java <<'EOF'
          package com.bdtecnologia.proativo;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.app.DownloadManager;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.media.AudioManager;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.MediaStore;
          import android.util.Size;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.appcompat.app.AppCompatActivity;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageAnalysis;
          import androidx.camera.core.ImageProxy;
          import androidx.camera.core.Preview;
          import androidx.camera.core.resolutionselector.ResolutionSelector;
          import androidx.camera.core.resolutionselector.ResolutionStrategy;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;
          import com.google.mlkit.vision.barcode.BarcodeScanner;
          import com.google.mlkit.vision.barcode.BarcodeScanning;
          import com.google.mlkit.vision.common.InputImage;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends AppCompatActivity {
              private WebView web;
              private Button btnMenuFlutuante;
              private Button btnCamera;
              private FrameLayout overlayScanner;
              private PreviewView previewView;
              private ProcessCameraProvider cameraProvider;
              private Camera cameraAtual;
              private boolean lanternaLigada = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);

                  btnMenuFlutuante = new Button(this);
                  btnMenuFlutuante.setText("\u2190 Menu");
                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.TOP | Gravity.START;
                  int margem = dp(12);
                  lp.setMargins(margem, dp(44), margem, margem);
                  btnMenuFlutuante.setLayoutParams(lp);
                  btnMenuFlutuante.setAlpha(0.92f);
                  btnMenuFlutuante.setTextColor(0xFFFFFFFF);
                  btnMenuFlutuante.setBackgroundColor(0xCC333333);
                  btnMenuFlutuante.setVisibility(View.GONE);
                  final float[] desl = new float[2];
                  final boolean[] moveu = new boolean[1];
                  btnMenuFlutuante.setOnTouchListener((v, ev) -> {
                      switch (ev.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              desl[0] = v.getX() - ev.getRawX();
                              desl[1] = v.getY() - ev.getRawY();
                              moveu[0] = false;
                              return false;
                          case MotionEvent.ACTION_MOVE:
                              float nx = ev.getRawX() + desl[0];
                              float ny = ev.getRawY() + desl[1];
                              if (!moveu[0] && (Math.abs(nx - v.getX()) > 12 || Math.abs(ny - v.getY()) > 12)) moveu[0] = true;
                              if (moveu[0]) {
                                  v.setX(nx);
                                  v.setY(ny);
                                  return true;
                              }
                              return false;
                          default:
                              return false;
                      }
                  });
                  btnMenuFlutuante.setOnClickListener(v -> {
                      if (web.canGoBack()) {
                          web.goBack();
                      } else {
                          web.loadUrl("https://badalipe.github.io/proativo/");
                      }
                  });

                  btnCamera = new Button(this);
                  btnCamera.setText("\uD83D\uDCF7");
                  FrameLayout.LayoutParams lpCam = new FrameLayout.LayoutParams(dp(62), dp(62));
                  lpCam.gravity = Gravity.BOTTOM | Gravity.END;
                  lpCam.setMargins(dp(20), dp(20), dp(20), dp(20));
                  btnCamera.setLayoutParams(lpCam);
                  btnCamera.setTextSize(26);
                  btnCamera.setTextColor(0xFFFFFFFF);
                  android.graphics.drawable.GradientDrawable fundoCam = new android.graphics.drawable.GradientDrawable(
                          android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF0091EA, 0xFF003E7E});
                  fundoCam.setShape(android.graphics.drawable.GradientDrawable.OVAL);
                  fundoCam.setStroke(dp(2), 0xB3FFFFFF);
                  btnCamera.setBackground(fundoCam);
                  if (Build.VERSION.SDK_INT >= 21) btnCamera.setElevation(dp(8));
                  btnCamera.setVisibility(View.GONE);
                  final float[] deslCam = new float[2];
                  final boolean[] moveuCam = new boolean[1];
                  btnCamera.setOnTouchListener((v, ev) -> {
                      switch (ev.getActionMasked()) {
                          case MotionEvent.ACTION_DOWN:
                              deslCam[0] = v.getX() - ev.getRawX();
                              deslCam[1] = v.getY() - ev.getRawY();
                              moveuCam[0] = false;
                              return false;
                          case MotionEvent.ACTION_MOVE:
                              float cx = ev.getRawX() + deslCam[0];
                              float cy = ev.getRawY() + deslCam[1];
                              if (!moveuCam[0] && (Math.abs(cx - v.getX()) > 12 || Math.abs(cy - v.getY()) > 12)) moveuCam[0] = true;
                              if (moveuCam[0]) {
                                  v.setX(cx);
                                  v.setY(cy);
                                  return true;
                              }
                              return false;
                          default:
                              return false;
                      }
                  });
                  btnCamera.setOnClickListener(v -> abrirScannerNativo());

                  FrameLayout root = new FrameLayout(this);
                  root.addView(web);
                  root.addView(btnMenuFlutuante);
                  root.addView(btnCamera);
                  setContentView(root);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  web.addJavascriptInterface(new AndroidBridge(this), "Android");

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          boolean noApp = (url != null && url.contains("badalipe.github.io"));
                          btnMenuFlutuante.setVisibility(noApp ? View.GONE : View.VISIBLE);
                          btnCamera.setVisibility(View.VISIBLE);
                      }
                  });

                  web.setDownloadListener((url, userAgent, contentDisposition, mimetype, contentLength) -> {
                      if (url.startsWith("blob:")) {
                          String js = "(async()=>{try{const r=await fetch('" + url + "');"
                                  + "const b=await r.blob();const fr=new FileReader();"
                                  + "fr.onload=()=>Android.salvarBase64(fr.result.split(',')[1],'" + mimetype + "');"
                                  + "fr.readAsDataURL(b);}catch(e){}})()";
                          web.evaluateJavascript(js, null);
                      } else if (url.startsWith("data:")) {
                          String base64 = url.substring(url.indexOf(",") + 1);
                          new AndroidBridge(MainActivity.this).salvarBase64(base64, mimetype);
                      } else {
                          try {
                              DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                              req.setMimeType(mimetype);
                              req.addRequestHeader("User-Agent", userAgent);
                              req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              String nome = URLUtil.guessFileName(url, contentDisposition, mimetype);
                              req.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, nome);
                              ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                              Toast.makeText(MainActivity.this, "Baixando " + nome, Toast.LENGTH_LONG).show();
                          } catch (Exception e) {
                              Toast.makeText(MainActivity.this, "Nao foi possivel baixar.", Toast.LENGTH_LONG).show();
                          }
                      }
                  });

                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 101);
                  }

                  web.loadUrl("https://badalipe.github.io/proativo/");
              }

              @SuppressLint("UnsafeOptInUsageError")
              private void abrirScannerNativo() {
                  if (Build.VERSION.SDK_INT >= 23 && checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.CAMERA}, 102);
                      Toast.makeText(this, "Permita o acesso a camera e toque novamente.", Toast.LENGTH_LONG).show();
                      return;
                  }

                  overlayScanner = new FrameLayout(this);
                  overlayScanner.setBackgroundColor(0xFF000000);

                  previewView = new PreviewView(this);
                  previewView.setScaleType(PreviewView.ScaleType.FILL_CENTER);
                  overlayScanner.addView(previewView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  View moldura = new View(this);
                  android.graphics.drawable.GradientDrawable contorno = new android.graphics.drawable.GradientDrawable();
                  contorno.setShape(android.graphics.drawable.GradientDrawable.RECTANGLE);
                  contorno.setStroke(dp(3), 0xB3FFFFFF);
                  contorno.setCornerRadius(dp(14));
                  moldura.setBackground(contorno);
                  FrameLayout.LayoutParams lpM = new FrameLayout.LayoutParams(dp(280), dp(170));
                  lpM.gravity = Gravity.CENTER;
                  moldura.setLayoutParams(lpM);
                  overlayScanner.addView(moldura);

                  Button btnFechar = new Button(this);
                  btnFechar.setText("Fechar");
                  btnFechar.setTextColor(0xFFFFFFFF);
                  btnFechar.setBackgroundColor(0xCC333333);
                  FrameLayout.LayoutParams lpF = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lpF.gravity = Gravity.TOP | Gravity.START;
                  lpF.setMargins(dp(16), dp(48), 0, 0);
                  btnFechar.setLayoutParams(lpF);
                  btnFechar.setOnClickListener(v -> fecharScannerNativo(null));
                  overlayScanner.addView(btnFechar);

                  Button btnLanterna = new Button(this);
                  btnLanterna.setText("Lanterna");
                  btnLanterna.setTextColor(0xFFFFFFFF);
                  btnLanterna.setBackgroundColor(0xCC333333);
                  FrameLayout.LayoutParams lpL = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lpL.gravity = Gravity.TOP | Gravity.END;
                  lpL.setMargins(0, dp(48), dp(16), 0);
                  btnLanterna.setLayoutParams(lpL);
                  btnLanterna.setOnClickListener(v -> {
                      if (cameraAtual != null) {
                          lanternaLigada = !lanternaLigada;
                          cameraAtual.getCameraControl().enableTorch(lanternaLigada);
                      }
                  });
                  overlayScanner.addView(btnLanterna);

                  TextView rotulo = new TextView(this);
                  rotulo.setText("Scanner Google ML Kit");
                  rotulo.setTextColor(0xFFFFFFFF);
                  rotulo.setTextSize(14);
                  FrameLayout.LayoutParams lpR = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lpR.gravity = Gravity.TOP | Gravity.CENTER_HORIZONTAL;
                  lpR.setMargins(0, dp(56), 0, 0);
                  overlayScanner.addView(rotulo, lpR);

                  TextView dica = new TextView(this);
                  dica.setText("Aponte o codigo de barras para a moldura");
                  dica.setTextColor(0xFFFFFFFF);
                  dica.setTextSize(15);
                  FrameLayout.LayoutParams lpD = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lpD.gravity = Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL;
                  lpD.setMargins(0, 0, 0, dp(90));
                  overlayScanner.addView(dica, lpD);

                  addContentView(overlayScanner, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  ListenableFuture<ProcessCameraProvider> futuro = ProcessCameraProvider.getInstance(this);
                  futuro.addListener(() -> {
                      try {
                          cameraProvider = futuro.get();
                          android.util.DisplayMetrics dm = getResources().getDisplayMetrics();
                          int wTela = dm.widthPixels;
                          int hTela = dm.heightPixels;
                          int wPrev = wTela;
                          int hPrev = hTela;
                          if (hPrev > wPrev && hPrev > 2560) { wPrev = wPrev * 2560 / hPrev; hPrev = 2560; }
                          else if (wPrev >= hPrev && wPrev > 2560) { hPrev = hPrev * 2560 / wPrev; wPrev = 2560; }
                          ResolutionSelector seletorPreview = new ResolutionSelector.Builder()
                                  .setResolutionStrategy(new ResolutionStrategy(new Size(wPrev, hPrev), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER))
                                  .build();
                          int wAn = wTela;
                          int hAn = hTela;
                          if (hAn > wAn && hAn > 1920) { wAn = wAn * 1920 / hAn; hAn = 1920; }
                          else if (wAn >= hAn && wAn > 1920) { hAn = hAn * 1920 / wAn; wAn = 1920; }
                          ResolutionSelector seletorAnalise = new ResolutionSelector.Builder()
                                  .setResolutionStrategy(new ResolutionStrategy(new Size(wAn, hAn), ResolutionStrategy.FALLBACK_RULE_CLOSEST_HIGHER_THEN_LOWER))
                                  .build();
                          Preview preview = new Preview.Builder().setResolutionSelector(seletorPreview).build();
                          preview.setSurfaceProvider(previewView.getSurfaceProvider());

                          BarcodeScanner leitor = BarcodeScanning.getClient();
                          ImageAnalysis analise = new ImageAnalysis.Builder()
                                  .setResolutionSelector(seletorAnalise)
                                  .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                                  .build();
                          analise.setAnalyzer(ContextCompat.getMainExecutor(this), imageProxy -> {
                              android.media.Image imagem = imageProxy.getImage();
                              if (imagem != null) {
                                  InputImage entrada = InputImage.fromMediaImage(imagem, imageProxy.getImageInfo().getRotationDegrees());
                                  leitor.process(entrada)
                                          .addOnSuccessListener(barcodes -> {
                                              for (int idx = 0; idx < barcodes.size(); idx++) {
                                                  String codigo = barcodes.get(idx).getRawValue();
                                                  if (codigo != null && !codigo.isEmpty()) {
                                                      fecharScannerNativo(codigo);
                                                      return;
                                                  }
                                              }
                                          })
                                          .addOnCompleteListener(task -> imageProxy.close());
                              } else {
                                  imageProxy.close();
                              }
                          });

                          cameraProvider.unbindAll();
                          cameraAtual = cameraProvider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analise);
                      } catch (Exception e) {
                          fecharScannerNativo(null);
                          Toast.makeText(this, "Nao foi possivel abrir a camera.", Toast.LENGTH_LONG).show();
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private void fecharScannerNativo(String codigo) {
                  lanternaLigada = false;
                  cameraAtual = null;
                  if (cameraProvider != null) {
                      cameraProvider.unbindAll();
                      cameraProvider = null;
                  }
                  if (overlayScanner != null) {
                      ViewGroup pai = (ViewGroup) overlayScanner.getParent();
                      if (pai != null) pai.removeView(overlayScanner);
                      overlayScanner = null;
                      previewView = null;
                  }
                  if (codigo != null) {
                      try {
                          ToneGenerator tom = new ToneGenerator(AudioManager.STREAM_NOTIFICATION, 100);
                          tom.startTone(ToneGenerator.TONE_PROP_BEEP, 150);
                      } catch (Exception ignored) {}
                      if (Build.VERSION.SDK_INT >= 26) {
                          try {
                              Vibrator v = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                              if (v != null) v.vibrate(VibrationEffect.createOneShot(120, VibrationEffect.DEFAULT_AMPLITUDE));
                          } catch (Exception ignored) {}
                      }
                      String seguro = codigo.replace("'", "").replace("\\", "");
                      String js = "(function(c){try{"
                              + "var alvo=document.activeElement;"
                              + "if(alvo&&alvo.tagName==='INPUT'&&(alvo.type==='text'||alvo.type==='search'||alvo.type==='number'||alvo.type==='')){alvo.value=c;alvo.dispatchEvent(new Event('input',{bubbles:true}));alvo.dispatchEvent(new Event('change',{bubbles:true}));alvo.dispatchEvent(new KeyboardEvent('keyup',{bubbles:true}));return;}"
                              + "var p=document.getElementById('proativo-modal');"
                              + "var t=document.getElementById('trocas-modal');"
                              + "if(p&&!p.classList.contains('hidden')){var i=document.getElementById('pro_codigo');if(i){i.value=c;i.dispatchEvent(new Event('input',{bubbles:true}));}buscarProduto('proativo');return;}"
                              + "if(t&&!t.classList.contains('hidden')){var i2=document.getElementById('trc_codigo');if(i2){i2.value=c;i2.dispatchEvent(new Event('input',{bubbles:true}));}buscarProduto('trocas');return;}"
                              + "var ins=document.querySelectorAll('input');"
                              + "for(var k=0;k<ins.length;k++){var e=ins[k];var r=e.getBoundingClientRect();"
                              + "if(r.width>0&&r.height>0&&(e.type==='text'||e.type==='search'||e.type==='number'||e.type==='')){"
                              + "e.focus();e.value=c;"
                              + "e.dispatchEvent(new Event('input',{bubbles:true}));"
                              + "e.dispatchEvent(new Event('change',{bubbles:true}));"
                              + "e.dispatchEvent(new KeyboardEvent('keyup',{bubbles:true}));"
                              + "break;}}"
                              + "}catch(err){}})('" + seguro + "')";
                      web.evaluateJavascript(js, null);
                  }
              }

              private int dp(int valor) {
                  return (int) (valor * getResources().getDisplayMetrics().density + 0.5f);
              }

              @Override
              public void onBackPressed() {
                  if (overlayScanner != null) {
                      fecharScannerNativo(null);
                      return;
                  }
                  if (web != null && web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              public static class AndroidBridge {
                  private final android.app.Activity activity;
                  AndroidBridge(android.app.Activity a) { activity = a; }

                  @JavascriptInterface
                  public void salvarBase64(String base64, String mime) {
                      try {
                          byte[] bytes = android.util.Base64.decode(base64, android.util.Base64.DEFAULT);
                          String ext = ".xlsx";
                          if (mime != null && mime.contains("pdf")) ext = ".pdf";
                          if (mime != null && mime.contains("csv")) ext = ".csv";
                          String nome = "Relatorio_" + System.currentTimeMillis() + ext;

                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.Downloads.DISPLAY_NAME, nome);
                              values.put(MediaStore.Downloads.MIME_TYPE, mime);
                              values.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = activity.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri == null) throw new Exception("uri nula");
                              OutputStream out = activity.getContentResolver().openOutputStream(uri);
                              out.write(bytes);
                              out.close();
                          } else {
                              File dir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              if (!dir.exists()) dir.mkdirs();
                              File f = new File(dir, nome);
                              FileOutputStream fos = new FileOutputStream(f);
                              fos.write(bytes);
                              fos.close();
                          }
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Salvo em Downloads: " + nome, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          activity.runOnUiThread(() -> Toast.makeText(activity, "Erro ao salvar: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: |
          cd app-src
          gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp app-src/app/build/outputs/apk/debug/app-debug.apk ProAtivo-v2.apk

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ProAtivo-APK
          path: ProAtivo-v2.apk
