name: Gerar APK do Pró-Ativo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Instalar Android SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p app-src/app/src/main/java/com/bdtecnologia/proativo
          mkdir -p app-src/app/src/main/res/drawable

          echo "" | base64 -d > app-src/app/src/main/res/drawable/ic_launcher.png

          cat > app-src/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ProAtivo"
          include ':app'
          EOF

          cat > app-src/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.1.4' apply false
          }
          EOF

          cat > app-src/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app-src/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bdtecnologia.proativo'
              compileSdk 34

              defaultConfig {
                  applicationId "com.bdtecnologia.proativo"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app-src/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />

              <application
                  android:label="Pro-Ativo"
                  android:icon="@drawable/ic_launcher"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"






